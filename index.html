<script type="text/babel">
const { useState, useRef, useMemo, useEffect } = React;

/* ============================================================================
   ADMIN SETUP — one value. Submissions go straight into Google Drive.

   DRIVE_ENDPOINT is the Apps Script Web app /exec URL (see drive-upload/DEPLOY.md).
   Files land in  Flight Logs / Operator Uploads / <Operator> / <capture date> /
   and the nightly bake reads them from there.

   Leave it blank ONLY to fall back to download-package mode, where the operator
   gets a single .zip to send you and you drop it into the dashboard.
   ============================================================================ */
const CONFIG = {
  // PRIMARY now: files go straight into your Google Drive "Flight Logs" folder,
  // sorted by operator + date, via the Apps Script you deploy (see drive-upload/DEPLOY.md).
  // Paste the Web app /exec URL here to turn it on.
  DRIVE_ENDPOINT: 'https://script.google.com/macros/s/AKfycbw7oAUlT8xTqRpzSlYFd74Yb1vInhbI9RWdwWU2L2bkEv99-Mp0zjd5-vpa9soNeHqy/exec',
  DECRYPT_ENDPOINT: '',     // your deployed decrypt-service URL + /decrypt (encrypted .TXT → CSV)
};
window.DECRYPT_ENDPOINT = CONFIG.DECRYPT_ENDPOINT;   // flight-decoder.js reads this

// Roster — operators self-identify. Matches the dashboard roster.
// Each operator carries their HOME STATE — it is authoritative for area attribution (a pilot
// picking a same-named suburb from another state in the autocomplete must never re-state their
// work: "always associate Paul with New South Wales" — Damien, 13 Jul 2026). The autocomplete
// prefers home-state matches and the submission stamps the home state on every tagged area.
const ROSTER = [
  { id: 'op-marc',   name: 'Marc Margot',    state: 'NSW' },
  { id: 'op-paul',   name: 'Paul McConnell', state: 'NSW' },
  { id: 'op-lucas',  name: 'Lucas Moy',      state: 'VIC' },
  { id: 'op-jakob',  name: 'Jakob Kelly',    state: 'VIC' },
  { id: 'op-damien', name: 'Damien Poole',   state: 'QLD' },
  { id: 'op-alex',   name: 'Alex Ballard',   state: 'NSW' },
  { id: 'op-joe',    name: 'Joe Arthey',     state: 'WA' },
  { id: 'op-rob',    name: 'Rob O’Brien', state: 'QLD' },
  { id: 'op-sam',    name: 'Sam',            state: 'SA' },
  { id: 'op-justin', name: 'Justin',         state: 'SA' },
];

// Why a NON-FLYING, NON-OFF day happened. Day off is its own day-type (first-class button), so
// it's intentionally not in this weather/blocker list. RePL study was too until 17 Aug 2026 —
// removed as a day type once every core operator's RePL was complete, so it can no longer be
// selected; a day already logged against it in the past still shows correctly on the report,
// folded into "other work" there.
const NO_FLY_REASONS = [
  'Rain', 'Storms', 'High wind', 'Low cloud / poor light', 'Fog',
  'Equipment fault', 'CASA / permit hold', 'Site access', 'Other',
];
// Damien, 17 Aug 2026: "if they are not flying or doing image extraction... they need to put
// their reason for what they are doing that day... we need to know why they were away and what
// they were doing and it needs to show on the report." 'nofly' already has its own mandatory
// reason picker (NO_FLY_REASONS below); this covers the other three non-flying, non-extraction
// day types with one shared typed-reason box (rendered where dayType is chosen, further down).
const NEEDS_NOTE = (t) => t === 'other' || t === 'off' || t === 'leave';

// palette
const NAVY = '#0A1F5C', ORANGE = '#FF7A1A', INK = '#0E1320',
      MUTED = '#5A6270', FAINT = '#8A92A6', LINE = '#E2E6F0', BG = '#F4F6FB';

const fmtBytes = (n) => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
  : (n / 1048576).toFixed(1) + ' MB';

// SRT & TXT logs only for the crew by default — MP4/video goes through the VST tool. Two
// exceptions, both because the drone embeds telemetry INSIDE the video instead of writing a
// plain sidecar: Matrice 4E (Damien only) accepts .mp4/.mov — sniffed in-browser, video never
// uploads, written back to the source folder. Lito X1 was the second exception until 28 Jul 2026,
// when the crew switched SRT-alongside-video ON at the controller: it now writes a plain .SRT next
// to the .MP4, so its upload is IDENTICAL to the Air 3S and the form says nothing special about it.
// .lrf stays in the accept pattern purely as a silent fallback (a card recorded before the switch,
// or a controller that lost the setting); the .mp4 is still deliberately NOT accepted for the Lito
// (100+ MB, would need the M4E's chunked-scan treatment — see flight-decoder.js's size reasoning).
const FILE_ACCEPT = { air3s: /\.(srt|txt)$/i, lito: /\.(srt|txt|lrf)$/i, m4e: /\.(srt|txt|mp4|mov)$/i };
const okFile = (name, droneType) => (FILE_ACCEPT[droneType] || FILE_ACCEPT.air3s).test(name);
const fkey = (f) => f.name + '|' + f.size;
const todayISO = () => { const d = new Date(); const z = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const prettyDate = (iso) => { try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-AU',
  { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; } };

const formStyles = {
  field: { width: '100%', padding: '13px 14px', fontSize: 15, color: INK, background: '#fff',
    border: `1.5px solid ${LINE}`, borderRadius: 11, transition: 'border-color .15s, box-shadow .15s' },
  label: { display: 'block', fontSize: 12.5, fontWeight: 700, color: NAVY, letterSpacing: '0.02em',
    marginBottom: 8, textTransform: 'uppercase' },
  hint: { fontSize: 12.5, color: FAINT, marginTop: 6, lineHeight: 1.45 },
};

function Logo() {
  const el = document.getElementById('__logo');
  const src = el && el.src ? el.src : 'assets/arealytics-logo-full.png';
  return <img src={src} alt="Arealytics" style={{ height: 30, display: 'block' }}
    onError={(e) => { e.target.style.display = 'none'; }} />;
}

// ---- AU suburb ↔ postcode lookup (from au-localities.js, parsed once) ----
// Powers the coverage-screenshot cross-fill: type a suburb → postcode appears (and vice-versa).
const AU_LOCS = (() => {
  const raw = (typeof window !== 'undefined' && window.AU_LOCALITIES) || '';
  const rows = [], byPost = new Map();
  for (const line of raw.split('\n')) {
    if (!line) continue;
    const parts = line.split('|'); const s = parts[0], p = parts[1], t = parts[2] || '';
    if (!s || !p) continue;
    const rec = { s, p, t };
    rows.push(rec);
    if (!byPost.has(p)) byPost.set(p, []);
    byPost.get(p).push(rec);
  }
  return { rows, byPost };
})();
// Stable-sort matches so the operator's HOME STATE lists first — same-named suburbs exist in
// several states (Guildford NSW/TAS/WA) and pilots kept picking the wrong state's entry.
function homeFirst(rows, home) {
  if (!home) return rows;
  return rows.filter(r => r.t === home).concat(rows.filter(r => r.t !== home));
}
// suburbs matching a typed name (prefix first, then contains), capped, home state first
function suburbMatches(q, limit, home) {
  limit = limit || 8; q = (q || '').trim().toLowerCase();
  if (q.length < 2) return [];
  const starts = [], contains = [];
  for (const r of AU_LOCS.rows) {
    const sl = r.s.toLowerCase();
    if (sl.startsWith(q)) starts.push(r);
    else if (contains.length < 30 && sl.indexOf(q) > 0) contains.push(r);
  }
  const out = homeFirst(starts, home).slice(0, limit);
  if (out.length < limit) out.push(...homeFirst(contains, home).slice(0, limit - out.length));
  return out;
}
// suburbs whose postcode STARTS WITH the typed digits (so 42 → 4207/4209/…), home state first
function postcodeMatches(p, limit, home) {
  limit = limit || 8; p = (p || '').replace(/[^0-9]/g, '');
  if (p.length < 2) return [];
  const seen = new Set(), out = [];
  for (const r of AU_LOCS.rows) {
    if (r.p.indexOf(p) === 0) { const k = r.p + '|' + r.s; if (!seen.has(k)) { seen.add(k); out.push(r); } }
    if (out.length >= 40) break;
  }
  return homeFirst(out, home).slice(0, limit);
}
const suburbsAtPostcode = (p) => AU_LOCS.byPost.get((p || '').trim()) || [];

// One coverage screenshot's tied location: Suburb + Postcode, each with autocomplete + cross-fill.
function AreaAutocomplete({ cover, onChange, index, home }) {
  const [openField, setOpenField] = useState(null);   // 'suburb' | 'postcode' | null
  const sug = openField === 'suburb' ? suburbMatches(cover.suburb, 8, home)
    : openField === 'postcode' ? postcodeMatches(cover.postcode, 8, home) : [];
  const pick = (r) => { onChange({ suburb: r.s, postcode: r.p, state: r.t }); setOpenField(null); };
  const onSuburb = (v) => {
    const patch = { suburb: v };
    // Unique-match auto-fill prefers the operator's HOME STATE: "Guildford" is NSW+TAS+WA, and
    // Paul (NSW) must land on 2161 — never Tasmania's 7321 (13 Jul 2026).
    const exact = AU_LOCS.rows.filter(r => r.s.toLowerCase() === v.trim().toLowerCase());
    const inHome = home ? exact.filter(r => r.t === home) : [];
    const use = inHome.length === 1 ? inHome[0] : (exact.length === 1 ? exact[0] : null);
    if (use) { patch.postcode = use.p; patch.state = use.t; }
    onChange(patch);
  };
  const onPostcode = (v) => {
    v = v.replace(/[^0-9]/g, '').slice(0, 4);
    const patch = { postcode: v };
    if (v.length === 4) { const at = suburbsAtPostcode(v); if (at.length === 1) { patch.suburb = at[0].s; patch.state = at[0].t; } }
    onChange(patch);
  };
  const tied = cover.suburb && cover.suburb.trim() && /^\d{4}$/.test((cover.postcode || '').trim());
  const wrap = { position: 'relative', flex: 1, minWidth: 0 };
  const menu = { position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, zIndex: 30, background: '#fff',
    border: `1px solid ${LINE}`, borderRadius: 10, boxShadow: '0 12px 30px rgba(14,19,32,0.16)', overflow: 'hidden', maxHeight: 224, overflowY: 'auto' };
  // The postcode field is narrow (116px), so its dropdown must break out wider — anchored to its RIGHT
  // edge and grown leftward — or the suburb names truncate to "Bal…". Capped so it never leaves the card.
  const menuWide = { ...menu, left: 'auto', right: 0, width: 'min(280px, 78vw)' };
  const item = { padding: '9px 12px', fontSize: 14, color: INK, cursor: 'pointer', display: 'flex', justifyContent: 'space-between', gap: 10 };
  const inp = { ...formStyles.field, padding: '10px 12px', fontSize: 14.5 };
  return (
    <>
    <div style={{ display: 'flex', gap: 8, marginTop: 9 }}>
      <div style={wrap}>
        <input className="ar-field" style={inp} placeholder={`Suburb / area — screenshot ${index + 1}`}
          value={cover.suburb || ''} autoComplete="off"
          onChange={(e) => onSuburb(e.target.value)}
          onFocus={() => setOpenField('suburb')}
          onBlur={() => setTimeout(() => setOpenField(f => f === 'suburb' ? null : f), 120)} />
        {openField === 'suburb' && sug.length > 0 && (
          <div style={menu}>
            {sug.map((r, k) => (
              <div key={k} style={item} onMouseDown={(e) => e.preventDefault()} onClick={() => pick(r)}
                onMouseEnter={(e) => e.currentTarget.style.background = '#F4F6FB'}
                onMouseLeave={(e) => e.currentTarget.style.background = '#fff'}>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.s}</span>
                <span style={{ color: MUTED, fontFamily: '"JetBrains Mono", monospace', flexShrink: 0 }}>{r.p} {r.t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ ...wrap, flex: '0 0 116px' }}>
        <input className="ar-field" style={inp} placeholder="Postcode" inputMode="numeric"
          value={cover.postcode || ''} autoComplete="off"
          onChange={(e) => onPostcode(e.target.value)}
          onFocus={() => setOpenField('postcode')}
          onBlur={() => setTimeout(() => setOpenField(f => f === 'postcode' ? null : f), 120)} />
        {openField === 'postcode' && sug.length > 0 && (
          <div style={menuWide}>
            {sug.map((r, k) => (
              <div key={k} style={item} onMouseDown={(e) => e.preventDefault()} onClick={() => pick(r)}
                onMouseEnter={(e) => e.currentTarget.style.background = '#F4F6FB'}
                onMouseLeave={(e) => e.currentTarget.style.background = '#fff'}>
                <span style={{ fontFamily: '"JetBrains Mono", monospace', flexShrink: 0 }}>{r.p}</span>
                <span style={{ color: MUTED, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.s} {r.t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
    {/* WAS THIS A REFLY? — Damien, 20 Aug 2026: "it has to be a stepped order that needs to be
        selected or not before they move on or can submit."

        Deliberately a REQUIRED Yes/No rather than a tick box. An unticked box is ambiguous: it
        cannot tell "I considered it, it is new ground" apart from "I never looked at this". The
        pilot is the only person who knows, and getting it wrong costs real coverage, so the form
        makes them answer rather than letting silence stand in for No.

        A reflight draws no polygon on the tracking map, so its properties never enter national
        coverage. The answer decides whether this area's count credits the pilot only, or counts
        as new ground. PER AREA, because a pilot can fly new ground and a reflight the same day. */}
    <div
      style={{ marginTop: 9, padding: '10px 12px', borderRadius: 10,
               border: `1px solid ${cover.refly == null ? '#E69F00' : LINE}`,
               background: cover.refly == null ? '#FFFAEB' : '#FBFCFE' }}>
      <div style={{ fontSize: 13.5, fontWeight: 700, color: INK, marginBottom: 2 }}>
        Was this area a REFLY?
      </div>
      <div style={{ fontSize: 12, color: MUTED, lineHeight: 1.4, marginBottom: 9 }}>
        {cover.refly === true
          ? 'Re-covering ground already captured. It counts toward your day, not toward new coverage.'
          : cover.refly === false
            ? 'New ground, captured for the first time.'
            : 'You must answer this before you can submit.'}
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        {[['Yes — this is a refly', true], ['No — new ground', false]].map(([lab, val]) => (
          <button
            key={String(val)}
            type="button"
            onClick={() => onChange({ refly: val })}
            style={{
              flex: 1, padding: '10px 8px', borderRadius: 9, fontSize: 13.5, fontWeight: 700,
              cursor: 'pointer',
              border: `1.5px solid ${cover.refly === val ? (val ? '#B54708' : NAVY) : '#D8DEEC'}`,
              background: cover.refly === val ? (val ? '#FFF4E5' : '#EEF2FB') : '#fff',
              color: cover.refly === val ? (val ? '#8A4B00' : NAVY) : INK,
            }}>
            {lab}
          </button>
        ))}
      </div>
    </div>
    </>
  );
}

function App() {
  const [opId, setOpId] = useState(() => {
    // When embedded in the field app the operator is already signed in, so it passes ?op=op-<id>.
    // Preselect their name instead of making them pick it again — one less daily step.
    try { const p = new URLSearchParams(location.search).get('op');
      return (p && ROSTER.some(o => o.id === p)) ? p : ''; } catch (e) { return ''; }
  });
  const [otherName, setOtherName] = useState('');
  const [date, setDate] = useState(todayISO());
  // The day-type is the ONE required choice each day — it maps 1:1 to the reporting categories
  // (flew / weather-or-blocked / other work / extraction / day off / leave). Replaces the old flew
  // yes/no. 'repl' retired 17 Aug 2026 — RePL is complete for every core operator, so it is no
  // longer offered; a day already logged against it reports as other work on the dashboard.
  const [dayType, setDayType] = useState('flew'); // 'flew' | 'nofly' | 'other' | 'extract' | 'off' | 'leave'
  // SPLIT DAY (30 Jul 2026, pilots' request via Damien). A day is often two different days: drive
  // out, fly the morning, weather shuts it down after lunch. Reporting that whole day as "Flew"
  // hides the lost half; reporting it as "Couldn't fly" throws away real captured work. So the
  // day can be halved. `dayType` stays the AM value and the whole-day value when not split, which
  // is what keeps every existing manifest, the ingest and the board numbers working unchanged.
  const [splitDay, setSplitDay] = useState(false);
  const [dayTypePm, setDayTypePm] = useState('nofly');
  // GENERIC "other work" (Damien, 6 Aug 2026): iGuide scanning is only the first of these. Rather
  // than adding a new day type — and a code change, a deploy and a report column — every time the
  // crew picks up a new kind of non-flying job, ONE type carries a free-text description. The day
  // still classifies as WORKED-not-flying for the target maths; the words just say what it was.
  const [workNote, setWorkNote] = useState('');
  // Which drone was flown TODAY — every core pilot now carries both an Air 3S and a Lito X1
  // (Damien also has the Matrice 4E), and each drone hands over telemetry differently, so the
  // file picker's accepted types + on-screen instructions key off this (25 Jul 2026).
  const [droneType, setDroneType] = useState('air3s'); // 'air3s' | 'lito' | 'm4e'
  const [reason, setReason] = useState('');       // weather / blocker reason (when nofly)
  const [reasonOther, setReasonOther] = useState('');
  const [covers, setCovers] = useState([]);       // [{ file, url, suburb, postcode, state }] — each marked screenshot carries its OWN tied location (pilots fly MULTIPLE areas)
  const [files, setFiles] = useState([]);        // File[]
  const [decoded, setDecoded] = useState({});    // fkey -> { status, ...summary }
  // Ref, NOT state: it's read inside async decode callbacks (M4E extraction can run for minutes),
  // and a state value there is a stale closure — the pilot's manually-set date got clobbered.
  const dateTouchedRef = useRef(false);
  const [notes, setNotes] = useState('');
  const [drag, setDrag] = useState(false);
  const [coverDrag, setCoverDrag] = useState(false);   // drag state for the coverage-image dropzone
  const [coverErr, setCoverErr] = useState('');         // LOUD attach-time read failure (never wait for submit)
  const [status, setStatus] = useState('idle');  // idle | submitting | done | error
  const [progress, setProgress] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const [result, setResult] = useState(null);    // { ref, mode }
  const fileRef = useRef(null);
  const coverRef = useRef(null);   // hidden <input type=file> for the coverage screenshot
  // Damien only: a writable handle to the folder his M4E videos were dragged from (his SD card),
  // so the in-browser-extracted SRTs can be written straight back next to the source videos.
  const srtDirRef = useRef(null);
  const submittingRef = useRef(false);   // imperative double-submit lock (state alone races on slow phones)
  const [srtSaved, setSrtSaved] = useState('');   // status line for the write-back

  const driveOn = !!CONFIG.DRIVE_ENDPOINT;
  // The field app appends &lock=1 for a VERIFIED operator (from the Cloudflare sign-in) — lock the name to
  // them so nobody can submit as another operator. Only applies with a valid ?op; standalone use stays editable.
  const nameLocked = (() => {
    try { return new URLSearchParams(location.search).get('lock') === '1' && !!opId && ROSTER.some(o => o.id === opId); }
    catch (e) { return false; }
  })();
  const op = ROSTER.find(o => o.id === opId);
  const opName = opId === 'other' ? otherName.trim() : (op ? op.name : '');

  // ReOC compliance cards (duty log + daily risk assessment) — the field app appends &reoc=1
  // (mirroring its own window.REOC_ENABLED preview flag) only when Damien has switched ReOC preview
  // on. Gated on THREE things: embedded (so the public standalone form is untouched), a KNOWN
  // roster operator (R2 — never a self-declared free-text name in a compliance register), and the
  // flag — never shown by accident, never shown to anyone outside the signed-in field app.
  //
  // Deliberately keyed on `opOnRoster`, NOT on nameLocked. The field app omits &lock=1 for the
  // OWNER (so Damien can act as any operator), which meant the compliance cards silently vanished
  // for the one person who needs them most — the CRP filing his own duty and risk records. `lock`
  // is a UI affordance for the name field; it is not the identity boundary. The real identity check
  // is the gateway's Cloudflare Access JWT, which stamps created_by server-side and cannot be
  // forged from here, and the operator id must still resolve against the roster.
  const isEmbeddedFrame = window.self !== window.top;
  const opOnRoster = !!opId && ROSTER.some((o) => o.id === opId);
  const reocOn = (() => {
    try { return new URLSearchParams(location.search).get('reoc') === '1'; }
    catch (e) { return false; }
  })();
  const dutyOn = isEmbeddedFrame && opOnRoster && reocOn;

  const totalBytes = useMemo(() => files.reduce((a, f) => a + f.size, 0), [files]);

  // Aggregate decode readout for the file list.
  const decList = files.map(f => decoded[fkey(f)]).filter(Boolean);
  const decOk = decList.filter(d => d.status === 'ok').length;
  const decEnc = decList.filter(d => d.status === 'encrypted').length;
  const decErr = decList.filter(d => d.status === 'error').length;
  const decSec = decList.reduce((a, d) => a + (d.durationSec || 0), 0);
  const decodedNote = decList.length
    ? `  ·  ${decOk + decEnc} flight ${(decOk + decEnc) === 1 ? 'log' : 'logs'} ready${decErr ? ` · ${decErr} unreadable — remove to submit` : ''}${decSec ? ` · ${Math.round(decSec / 60)} min flown` : ''}`
    : '';

  // ---- per-field completion (drives the ticks + the submit gate) ----
  const decStates = files.map(f => decoded[fkey(f)] || { status: 'decoding' });
  const anyDecoding = decStates.some(d => d.status === 'decoding');
  const anyError = decStates.some(d => d.status === 'error');
  // Flew if EITHER half flew — the upload/coverage section must appear for a half-day of flying.
  const didFly = dayType === 'flew' || (splitDay && dayTypePm === 'flew');
  const nameDone = !!opName;
  const dateDone = !!date;
  const filesDone = didFly && files.length > 0 && !anyDecoding && !anyError
    && decStates.every(d => d.status === 'ok' || d.status === 'encrypted');
  // A no-fly in EITHER half needs a reason — otherwise a PM washout submits with no cause recorded.
  const anyNoFly = dayType === 'nofly' || (splitDay && dayTypePm === 'nofly');
  const reasonDone = anyNoFly && !!reason && (reason !== 'Other' || !!reasonOther.trim());

  const addFiles = (list) => {
    // submitDrive iterates a SNAPSHOT of `files` — anything added mid-upload would show in the list
    // but silently never send. Freeze the list while submitting.
    if (status === 'submitting') return;
    const incoming = Array.from(list || []).filter(f => okFile(f.name, droneType));
    const seen = new Set(files.map(f => fkey(f)));
    const fresh = incoming.filter(f => !seen.has(fkey(f)));
    if (!fresh.length) return;
    setFiles(prev => [...prev, ...fresh]);
    setDecoded(d => { const n = { ...d }; fresh.forEach(f => { n[fkey(f)] = { status: 'decoding' }; }); return n; });
    // Decode each new file in the browser — validate + summarise (SRT and TXT).
    const decodeOne = (f) => {
      const k = fkey(f);
      // Decoder missing (script failed to load) = FAIL LOUD. Never mark the file "ok": an undecoded
      // .MP4 would fall through to the raw-upload path and try to POST the multi-GB video itself.
      if (!window.FlightDecoder) { setDecoded(d => ({ ...d, [k]: { status: 'error', error: 'decoder failed to load — reload the page and re-add this file' } })); return Promise.resolve(); }
      return window.FlightDecoder.decode(f, (pct) => {
        setDecoded(d => ({ ...d, [k]: { ...(d[k] || {}), status: 'decoding', progress: pct } }));
      }).then(res => {
        setDecoded(d => ({ ...d, [k]: { status: res.ok ? ((res.encrypted && !res.decrypted) ? 'encrypted' : 'ok') : 'error', ...res } }));
        // First valid SRT date auto-fills the capture date (until the operator edits it).
        if (res.ok && res.dateISO && !dateTouchedRef.current) setDate(res.dateISO);
      }).catch(() => {
        setDecoded(d => ({ ...d, [k]: { status: 'error', error: 'could not be read' } }));
      });
    };
    // Text files decode in parallel (cheap), but VIDEOS go one at a time: each M4E extraction holds
    // tens of MB of chunk buffers + regex state — a 10-video drop decoded concurrently is ~500MB of
    // churn and kills the tab on a field phone.
    const isVid = (f) => /\.(mp4|mov|lrf)$/i.test(f.name);
    fresh.filter(f => !isVid(f)).forEach(decodeOne);
    (async () => { for (const f of fresh.filter(isVid)) await decodeOne(f); })();
  };
  const removeFile = (i) => {
    if (status === 'submitting') return;   // list is frozen while uploading (see addFiles)
    const f = files[i];
    setFiles(prev => prev.filter((_, j) => j !== i));
    if (f) setDecoded(d => { const n = { ...d }; delete n[fkey(f)]; return n; });
  };

  // Coverage screenshot — the pilot's marked/coloured picture of the area they flew today.
  // Just an image; stored alongside the flight files so management can see WHAT was covered.
  //
  // READ + COMPRESS AT ATTACH TIME. The old code kept only the File HANDLE and read the bytes at
  // submit — a screenshot that went unreadable between attach and submit (iCloud-evicted Desktop
  // file, stale picker handle) made every submit fail the same way with no clue why (13 Jul 2026:
  // covers 2+3 "Couldn't send" across 3 submissions while 10MB SRTs sailed through). Reading HERE
  // means an unreadable image fails LOUDLY the moment it's added, and submit never touches disk.
  // Compressing (≤2560px JPEG q0.92) keeps the coverage screenshots legible — map labels and
  // property counts stay readable — while still cutting a 2–3MB phone screenshot down. Raised from
  // 1800px/q0.85 on 23 Jul 2026 (Damien: the afternoon uploads were too low-quality to read).
  const readCover = (file) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, 2560 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL('image/jpeg', 0.92);
        resolve({ url, b64: dataUrl.slice(dataUrl.indexOf(',') + 1), mime: 'image/jpeg', outExt: 'jpg' });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => {
      // Browser can't DECODE it (e.g. HEIC in some browsers) — still read the raw bytes NOW so
      // submit never depends on the file handle. Only a failed read rejects.
      const r = new FileReader();
      r.onload = () => {
        const s = String(r.result || '');
        const m = /\.([a-z0-9]+)$/i.exec(file.name); let ext = m ? m[1].toLowerCase() : 'png';
        if (ext === 'jpeg') ext = 'jpg';

          mime: file.type || ({ heic: 'image/heic', png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif' }[ext] || 'application/octet-stream'),
          outExt: ext });
      };

      r.readAsDataURL(file);
    };

  });
  const setCover = async (list) => {
    if (status === 'submitting') return;   // frozen while uploading (see addFiles)
    const imgs = Array.from(list || []).filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|heic|gif)$/i.test(f.name));
    if (!imgs.length) return;
    if (coverRef.current) coverRef.current.value = '';   // let the same file be picked again next time
    const bad = [];
    for (const file of imgs) {
      try {
        const got = await readCover(file);
        setCovers(prev => [...prev, { file, url: got.url, b64: got.b64, mime: got.mime, outExt: got.outExt, suburb: '', postcode: '', state: '' }]);
      } catch (e) { bad.push(file.name); }
    }
    setCoverErr(bad.length
      ? `Couldn’t read ${bad.join(', ')} — it wasn’t added. If it’s still syncing (iCloud/Drive), open it once in Preview, then add it again.`
      : '');
  };
  const removeCover = (i) => {
    setCovers(prev => { const c = prev[i]; if (c && c.url) { try { URL.revokeObjectURL(c.url); } catch (e) {} } return prev.filter((_, j) => j !== i); });
  };
  // Merge a suburb/postcode/state patch into one screenshot's tied location.
  const updateCover = (i, patch) => setCovers(prev => prev.map((c, j) => j === i ? { ...c, ...patch } : c));
  const clearCovers = () => {
    setCovers(prev => { prev.forEach(c => { if (c && c.url) { try { URL.revokeObjectURL(c.url); } catch (e) {} } }); return []; });
    if (coverRef.current) coverRef.current.value = '';
    setCoverErr('');
  };
  // Name each coverage image so they sort next to the day's flights; the index keeps multiple areas
  // distinct in the operator's date folder. Extension comes from what we actually STORED at attach
  // time (compressed → .jpg; undecodable pass-through keeps its own ext).
  const coverNameFor = (cover, i) => `coverage-${date}-${i + 1}.${(cover && cover.outExt) || 'jpg'}`;

  // The decoded CSV for a file (SRT / legacy TXT built in-browser; encrypted TXT already CSV
  // from the decrypt service). Returns null when there's no telemetry to write.
  // Memoised: toCSV walks every telemetry frame (a 45-min TXT ≈ 27k rows) and submit needs the CSV
  // 2-3× per file — build it once per fkey. Only truthy results cache (a file mid-decode returns null
  // and must be recomputed later); cleared in reset().
  const csvCacheRef = useRef({});
  const csvFor = (f) => {
    const k = fkey(f);
    if (csvCacheRef.current[k] !== undefined) return csvCacheRef.current[k];
    const d = decoded[k];
    if (!d || !d.ok || (d.encrypted && !d.decrypted)) return null;
    let v = null;
    try { v = window.FlightDecoder && window.FlightDecoder.toCSV(d, { operator: opName }); }
    catch (e) { v = null; }
    if (v) csvCacheRef.current[k] = v;
    return v;
  };
  const csvName = (name) => name.replace(/\.(srt|txt|mp4|mov)$/i, '') + '.csv';

  // ---- Damien only: write the extracted M4E SRTs back next to the source videos (his SD card) ----
  const isDamien = opId === 'op-damien';
  // Running inside the dashboard's overlay (cross-origin iframe)? The folder-write API is blocked there,
  // so the card write-back can't work — we download instead, and the UI says so honestly.
  const isEmbedded = window.self !== window.top;
  // Pull a dropped FOLDER's flight files into the form, and remember the folder so the SRTs
  // can be written straight back into it (Chromium File System Access).
  const addFilesFromDir = async (dir) => {
    const out = [];
    try { for await (const e of dir.values()) { if (e.kind === 'file' && okFile(e.name, 'm4e')) out.push(await e.getFile()); } }   // folder-drop is Damien's M4E card workflow only → videos allowed
    catch (_) {}
    if (out.length) addFiles(out);
  };
  // The SRTs we extracted in-browser from this submission's M4E videos.
  const extractedSrts = () => files.map(f => {
    const d = decoded[fkey(f)] || {};
    return d.extractedSrt ? { name: f.name.replace(/\.(mp4|mov|lrf)$/i, '.srt'), text: d.extractedSrt } : null;
  }).filter(Boolean);
  // Download the extracted SRTs — the fallback when the card can't be written directly (embedded frame or
  // no File System Access API). Firing one download per file makes the browser throttle/silently DROP part
  // of a burst (that's how 16 became 10), so bundle 2+ into ONE .zip — a single download can't be partially
  // lost — and report the REAL count, never the attempted count.
  const downloadSrts = async (srts) => {
    if (!srts.length) return;
    try {
      if (srts.length === 1) {
        const s = srts[0];
        const url = URL.createObjectURL(new Blob([s.text], { type: 'application/x-subrip' }));
        const a = document.createElement('a');
        a.href = url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        setSrtSaved('✓ 1 SRT downloaded — check your Downloads folder.');
        return;
      }
      const zip = new window.JSZip();
      for (const s of srts) zip.file(s.name, s.text);
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
      const zipName = 'Arealytics_' + (date || todayISO()) + '_SRTs.zip';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = zipName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
      setSrtSaved('✓ All ' + srts.length + ' SRTs downloaded as ' + zipName + ' — unzip them into your card folder.');
    } catch (e) {
      setSrtSaved('Could not package the SRTs (' + ((e && e.message) || e) + '). Try “Open in browser”.');
    }
  };
  const saveSrtsToCard = async () => {
    const srts = extractedSrts();
    if (!srts.length) return;
    // A folder/file picker can't open inside an embedded (cross-origin) frame — when the form runs inside the
    // dashboard's "LOG A CAPTURE" overlay, just download the SRTs instead. A standalone tab still writes the
    // files straight back into the folder you pick (the original behaviour).
    if (window.self !== window.top || !window.showDirectoryPicker) { await downloadSrts(srts); return; }
    let dir = srtDirRef.current;
    try {
      if (!dir) {
        dir = await window.showDirectoryPicker({ id: 'arealytics-m4e-srt', mode: 'readwrite' });
        srtDirRef.current = dir;
      }
      if (dir.requestPermission && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') {
        setSrtSaved('Folder write permission was declined.'); return;
      }
      let n = 0;
      for (const s of srts) {
        const fh = await dir.getFileHandle(s.name, { create: true });
        const w = await fh.createWritable(); await w.write(s.text); await w.close(); n++;
      }
      setSrtSaved('✓ ' + n + ' SRT' + (n === 1 ? '' : 's') + ' saved to “' + (dir.name || 'your folder') + '”.');
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // user closed the folder picker — fine
      await downloadSrts(srts);                    // blocked / unsupported → download instead, never lose them
    }
  };

  // validation
  const errors = [];
  if (!nameDone) errors.push('Select your name.');
  if (!dateDone) errors.push('Choose the capture date.');
  if (didFly) {
    if (files.length === 0) errors.push('Upload the day’s .SRT / .TXT flight logs — or pick a non-flying day above.');
    else if (anyDecoding) errors.push('Checking your files… one moment.');
    else if (anyError) errors.push('Remove the file(s) that couldn’t be read, then add the correct ones.');
    // Coverage screenshot is REQUIRED on a flying day — it's the visual record of the area flown.
    if (!covers.length) errors.push('Add at least one coverage screenshot of the area(s) you flew (marked & coloured).');
    // Every screenshot must carry its OWN suburb + postcode — that's the location tied to that photo.
    else if (covers.some(c => !(c.suburb && c.suburb.trim()) || !/^\d{4}$/.test((c.postcode || '').trim())))
      errors.push('Add the suburb and postcode next to each coverage screenshot.');
    // REFLY is a required answer, not an optional tick. Silence must never be read as "No" —
    // a missed reflight puts properties into national coverage that were already counted.
    const unanswered = covers
      .map((c, i) => (c.refly == null ? (c.suburb || '').trim() || `screenshot ${i + 1}` : null))
      .filter(Boolean);
    if (unanswered.length)
      errors.push('Answer “Was this area a REFLY?” for ' + unanswered.join(', ') + '.');
  }
  if (anyNoFly && !reason) errors.push('Pick why you couldn\u2019t fly.');
  if (anyNoFly && reason === 'Other' && !reasonOther.trim()) errors.push('Add a short reason.');
  if ((NEEDS_NOTE(dayType) || (splitDay && NEEDS_NOTE(dayTypePm))) && !workNote.trim())
    errors.push('Add a short reason for the day \u2014 what the work was, or why you were away.');
  if (splitDay && dayType === dayTypePm) errors.push('AM and PM are the same \u2014 untick the split, or pick two different halves.');
  const reasonFinal = reason === 'Other' ? (reasonOther.trim() || 'Other') : reason;
  const canSubmit = errors.length === 0 && status !== 'submitting';

  const makeRef = () => `AR-${date.replace(/-/g, '')}-${(opId === 'other' ? 'EXT' : (op ? op.id.replace('op-', '').toUpperCase() : 'OP'))}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

  const submit = async () => {
    // Imperative double-tap guard: two taps landing before a React commit both see canSubmit=true
    // (closure), which would mint two refs + two manifests for the same day.
    if (!canSubmit || submittingRef.current) return;
    submittingRef.current = true;
    setStatus('submitting'); setErrorMsg(''); setProgress('');
    const ref = makeRef();
    const meta = {
      ref, operator: opName, op_id: opId,
      capture_date: date,
      // day_type is the reporting-friendly category; `flew` is kept as a derived boolean so the
      // existing dashboard ingest (which reads meta.flew) keeps working unchanged.
      day_type: dayType, flew: didFly, work_note: workNote.trim(),
      // SPLIT DAY (30 Jul 2026). `day_parts` is the new truth when present: each half is worth
      // 0.5 of a day, so AM flew + PM weather is 0.5 flown + 0.5 weather and the day still totals
      // 1.0 man-day. Absent on a normal day and on every historical manifest, and the ingest
      // falls back to the whole-day `day_type` in that case, so nothing already reported moves.
      day_parts: splitDay ? { am: dayType, pm: dayTypePm } : null,
      reason: (dayType === 'nofly' || (splitDay && dayTypePm === 'nofly')) ? reasonFinal : '',
      // Each coverage screenshot carries its OWN tied location. `areas` is the structured record
      // (image ↔ suburb/postcode/state); `area_flown` is the joined free-text kept for the existing ingest.
      areas: (didFly && covers.length) ? covers.map((c, i) => ({
        image: coverNameFor(c, i), suburb: (c.suburb || '').trim(),
        // The OPERATOR'S home state is authoritative for attribution — a wrong-state autocomplete
        // pick must never re-state their work. The picked state is kept as state_picked for trace.
        postcode: (c.postcode || '').trim(), state: (op && op.state) || c.state || '',
        // REFLY: this area re-covers already-counted ground. Credited to the pilot, excluded from
        // the national universe. Always emitted as a real boolean so a missing tick is an explicit
        // false rather than an absent key the pipeline has to guess about.
        refly: c.refly === true,
        state_picked: c.state || '' })) : [],
      area_flown: didFly ? covers.map(c => `${(c.suburb || '').trim()} ${(c.postcode || '').trim()}`.trim()).filter(Boolean).join(', ') : '',
      // Day-level summary of the per-area flags. NOT the source of truth (that is areas[].refly);
      // it exists so a reader can answer "was there any refly today" without walking the list.
      refly_any: !!(didFly && covers.some(c => c.refly)),
      refly_all: !!(didFly && covers.length && covers.every(c => c.refly)),
      coverage_images: (didFly && covers.length) ? covers.map((c, i) => coverNameFor(c, i)) : [],
      coverage_image: (didFly && covers.length) ? coverNameFor(covers[0], 0) : '',   // first one, kept for the existing manifest reader
      decoded: didFly ? files.map(f => { const d = decoded[fkey(f)] || {}; return {
        name: f.name, status: d.status || null, model: d.model || null, encrypted: !!d.encrypted,
        decrypted: !!d.decrypted, durationSec: d.durationSec || 0, samples: d.samples || 0,
        distanceM: d.distanceM || 0, maxAltM: d.maxAltM || 0, dateISO: d.dateISO || null,
        home: d.home || null, serial: d.serial || null, hasCsv: !!csvFor(f) }; }) : [],
      notes: notes.trim(), submitted_at: new Date().toISOString(),
    };
    try {
      if (driveOn) await submitDrive(meta);
      else await submitBundle(meta);
      setResult({ ref, mode: driveOn ? 'drive' : 'bundle', recorded: driveRecorded });
      setStatus('done');
      // If a card folder was dropped this session, write the SRTs straight back into it now —
      // we already hold a writable handle, so no extra prompt. (File-drops use the button instead.)
      if (srtDirRef.current && extractedSrts().length) saveSrtsToCard();
    } catch (e) {
      const m = String(e && e.message ? e.message : e);
      // A bare TypeError("Failed to fetch") means the service was unreachable — say that in
      // operator language instead of browser-speak.
      setErrorMsg(/failed to fetch|networkerror|load failed/i.test(m)
        ? 'Couldn’t reach the upload service — check your connection and tap Submit again. Anything already received is replaced, not duplicated.'
        : m);
      setStatus('error');
    } finally {
      submittingRef.current = false;
    }
  };

  // ---- Google Drive path (primary) — files land in Flight Logs/Operator Uploads/<name>/<date>/ ----
  function fileToB64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => { const s = String(r.result || ''); resolve(s.slice(s.indexOf(',') + 1)); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  // Rebuild a Blob from the base64 captured at attach time (bundle/hosted paths must not
  // re-read file handles either — same stale-handle trap as the Drive path).
  function b64ToBlob(b64, mime) {
    const bin = atob(b64 || '');
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'application/octet-stream' });
  }
  async function postDrive(payload) {
    // The Apps Script writes the file server-side the moment this POST is DELIVERED. Its success reply,
    // though, is served from a DIFFERENT Google domain (script.googleusercontent.com) that sends no CORS
    // header — so the browser refuses to let us READ it, and that read-block was being mis-reported as an
    // upload failure even though the file had already landed (operators saw a red error + re-submitted).
    // So we DELIVER with mode:'no-cors' (the body still reaches doPost; the opaque reply is simply ignored)
    // and confirm for real afterwards via verifyDrive() — a JSONP read that CORS does not block.
    // A genuine network failure (offline / endpoint unreachable) still REJECTS here, so it's caught + retried.
    await fetch(CONFIG.DRIVE_ENDPOINT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    return { ok: true };   // "delivered", NOT "confirmed" — verifyDrive() is the source of truth
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  // Single JSONP confirmation attempt (CORS-safe: a <script> GET the browser never CORS-checks).
  // The Apps Script's doGet answers ?verify=1&op=&date=&callback= with callback({files:[...]}).
  // Resolves the name array, or null if THIS attempt got no answer in time.
  function verifyDriveOnce(operator, date, timeoutMs) {
    return new Promise((resolve) => {
      const cb = '__arv' + Math.floor(performance.now()) + Math.floor(Math.random() * 1e6);
      let done = false;
      const s = document.createElement('script');
      const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.remove(); };
      const finish = (val) => { if (done) return; done = true; cleanup(); resolve(val); };
      window[cb] = (data) => finish(data && Array.isArray(data.files) ? data.files : null);
      // WHY a verify failed is the difference between "slow" and "the service is gone" (18 Aug
      // 2026). A <script> pointed at a non-2xx response fires onerror in every current browser,
      // and a retired Apps Script deployment answers 404 with an HTML page — so onerror on every
      // attempt is strong evidence the endpoint itself is dead, not merely busy. A timeout means
      // the opposite: something answered slowly, or not at all, and the files may well be fine.
      // Recorded so the message the operator reads can tell them which of those it is.
      s.onerror = () => { verifyDrive.lastWhy = 'error'; finish(null); };
      s.onload = () => finish(null);   // script loaded but callback never ran this attempt
      const q = 'verify=1&op=' + encodeURIComponent(operator) + '&date=' + encodeURIComponent(date) + '&callback=' + cb;
      s.src = CONFIG.DRIVE_ENDPOINT + (CONFIG.DRIVE_ENDPOINT.indexOf('?') === -1 ? '?' : '&') + q;
      document.body.appendChild(s);
      setTimeout(() => finish(null), timeoutMs);
    });
  }
  // Confirm what actually landed — the SOURCE OF TRUTH for the whole submission. A single missed
  // attempt (a slow network, a momentary Apps Script blip) is NOT proof the endpoint is unreachable,
  // so this retries before giving up. Only returns null once every attempt has failed to answer —
  // the caller must treat that as UNCONFIRMED, never as silent success. (16 Jul 2026: a single verify
  // miss was being read as "all good" and an operator's entire day's submission landed nowhere while
  // they saw a clean success screen — this replaced that one-shot check.)
  async function verifyDrive(operator, date) {
    const timeouts = [5000, 7000, 12000];
    verifyDrive.lastWhy = '';          // reset per submission; set to 'error' by a non-2xx response
    for (let attempt = 0; attempt < timeouts.length; attempt++) {
      const result = await verifyDriveOnce(operator, date, timeouts[attempt]);
      if (result) { verifyDrive.lastWhy = ''; return result; }
      if (attempt < timeouts.length - 1) await sleep(900);
    }
    return null;
  }
  // Retry one upload a few times with backoff. SAFE to retry: the Apps Script de-dupes by filename
  // (removeExisting), so a re-sent file replaces rather than stacks. Throws only after all tries fail.
  // BACKOFF MUST OUTLAST A PER-MINUTE QUOTA (18 Aug 2026). This retried after 700ms then 1400ms —
  // a 2-second window — and Apps Script's quota is per MINUTE. Once it trips, every retry inside
  // that window spends the same exhausted budget and fails identically, so the file is written off
  // as lost while the service is merely busy. Damien submitted 37 files and got "13/37 flight files
  // confirmed": the first batch went through, the quota tripped, and the remaining 24 burned their
  // three attempts in two seconds and gave up.
  //
  // The same lesson was already applied to the compliance relay (3s/15s) and to the bake's readers
  // (8s/20s) on 12 Aug — but not here, to the path that carries every actual FILE, which is the one
  // that matters most. 2s, 20s then 60s means the last attempt lands on the far side of the minute
  // boundary, which is the only thing that can actually clear a per-minute quota.
  //
  // Cost is bounded and only paid on failure: a file that would have been lost now waits ~82s
  // before being declared lost, and a healthy upload is completely unaffected (first attempt, no
  // sleep). Losing a flight log costs a re-drive; waiting is free.
  const POST_BACKOFF_MS = [2000, 20000, 60000];
  async function postDriveRetry(payload, tries) {
    tries = tries || POST_BACKOFF_MS.length + 1;
    let lastErr;
    for (let attempt = 1; attempt <= tries; attempt++) {
      try { return await postDrive(payload); }
      catch (e) {
        lastErr = e;
        if (attempt < tries) await sleep(POST_BACKOFF_MS[attempt - 1] || 60000);
      }
    }
    throw lastErr;
  }
  // SHA-256 of a file, hex. This is what binds an uploaded file to the AUTHENTICATED manifest:
  // the files themselves upload straight to the Apps Script (unchanged — that path is deliberately
  // resilient, one file at a time with retries, after a hiccup once lost 6 of 10 flights), but the
  // manifest goes through the Access-verified gateway carrying these digests. A file that is later
  // substituted, or one uploaded by someone forging the endpoint, will not match any signed manifest.
  async function sha256Hex(blob) {
    try {
      const buf = await blob.arrayBuffer();
      const d = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      return '';   // never block a submission on hashing — an unhashed file is flagged, not lost
    }
  }

  // AUTHENTICATED SUBMISSION RECORD.
  //
  // The files upload straight to the Apps Script, which authenticates nothing — anyone holding that
  // /exec URL (it ships in a PUBLIC repo) could POST a submission as any operator on any date. So the
  // EVIDENCE of a submission is filed separately, through the Access-verified compliance gateway:
  // the parent field-app page holds the real Cloudflare Access session and relays it, exactly as it
  // already does for the duty log and the daily risk assessment.
  //
  // What that buys, and it is the whole point: the SERVER decides who submitted (created_by comes
  // from the verified Access identity, never from this payload), the record gets a unique id, a
  // timestamp and an append-only audit row, and it carries the SHA-256 of every file delivered. A
  // file substituted afterwards, or a submission forged straight at the uploader, will not match.
  //
  // Standalone (not embedded) there IS no Access session, so this cannot be filed. It fails LOUD
  // rather than pretending: the operator is told the files landed but the record did not.
  // RETRY (12 Aug 2026). Paul submitted, his 25 files landed, and this returned "no response from
  // the compliance service" — so he was told his record had not filed and had to decide, standing in
  // a field, whether to tap again. Diagnosed the same afternoon: Apps Script enforces a PER-MINUTE
  // quota and answers 404 when it is tripped. Spaced calls succeed 8 times out of 8; bursts fail
  // about one in four. It is transient, and a single attempt was never going to be enough.
  //
  // Retrying a WRITE is only safe because the server deduplicates, and that is not an assumption:
  // Paul tapped Submit three times that afternoon and the register holds exactly ONE record,
  // SUBM-2026-0103. The gateway keys on (operator, capture_date) and replaces rather than appends,
  // which is the same guarantee the error message has always promised the operator.
  //
  // The pauses are long because the quota is per MINUTE — retrying instantly just spends the same
  // exhausted budget. 3s then 15s, so a transient failure costs the pilot a moment of waiting
  // instead of an error screen and a decision.
  //
  // `onRetry` keeps the operator informed while this happens. Three attempts can take over a minute,
  // and a progress line that has not moved for that long reads as a frozen app — which is what makes
  // someone force-quit mid-submission. It says what is happening, so waiting feels like progress.
  function relaySubmission(meta, digests, coverCount, onRetry) {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    return (async () => {
      let last = { ok: false, error: 'no response from the compliance service' };
      const waits = [0, 3000, 15000];
      for (let i = 0; i < waits.length; i++) {
        if (waits[i]) {
          // `i` IS the retry number: waits[0] is the first attempt, so waits[1] is retry 1 of 2.
          if (onRetry) onRetry('Compliance service busy — retrying (' + i + ' of ' + (waits.length - 1) + ')…');
          await sleep(waits[i]);
        }
        last = await relaySubmissionOnce(meta, digests, coverCount);
        if (last.ok) return last;
        // Never retry a REFUSAL — a rejected payload or a missing Access session fails the same way
        // every time, and hammering it just delays telling the operator something they must act on.
        if (!/no response from the compliance service/i.test(last.error || '')) return last;
      }
      return last;
    })();
  }

  function relaySubmissionOnce(meta, digests, coverCount) {
    return new Promise((resolve) => {
      if (window.parent === window) {
        resolve({ ok: false, error: 'not signed in — open the daily log from the Arealytics field app so the submission can be recorded' });
        return;
      }
      const requestId = 'subm' + Math.random().toString(36).slice(2, 10);
      const timeoutId = setTimeout(() => {
        window.removeEventListener('message', onReply);
        resolve({ ok: false, error: 'no response from the compliance service' });
      }, 20000);
      function onReply(e) {
        const d = e.data || {};
        if (d.type !== 'capture-submission-write-result' || d.requestId !== requestId) return;
        clearTimeout(timeoutId);
        window.removeEventListener('message', onReply);
        resolve(d.ok ? { ok: true, record_id: d.record_id } : { ok: false, error: d.error || 'rejected' });
      }
      window.addEventListener('message', onReply);
      let targetOrigin = '*';
      try { if (location.ancestorOrigins && location.ancestorOrigins[0]) targetOrigin = location.ancestorOrigins[0]; } catch (e) {}
      window.parent.postMessage({
        type: 'capture-submission-write', requestId,
        source_form: 'daily-field-log', device_ts: new Date().toISOString(),
        payload: {
          operator: meta.op_id, capture_date: meta.capture_date,
          flew: !!meta.flew, reason: meta.reason || '', ref: meta.ref || '',
          file_count: digests.length, coverage_count: coverCount || 0,
          digests: digests,
        },
      }, targetOrigin);
    });
  }

  let driveRecorded = null;   // result of the authenticated submission record, read by the result screen
  async function submitDrive(meta) {
    // RESILIENT upload: each file is uploaded independently with retry, and one file failing NEVER
    // aborts the rest (the old loop threw on the first failure, silently abandoning every file after
    // it — that's how a transient hiccup lost 6 of 10 flights). We collect failures and report exactly
    // which flights didn't make it so the operator can re-send them (re-sends are de-duped server-side).
    const failed = [];       // GENUINE delivery failures (offline/unreachable) + client-side impossibles
    const attempted = [];     // names we DELIVERED — verifyDrive() confirms which of these actually landed
    const digests = [];       // {name, sha256, bytes} per delivered file — carried on the AUTHENTICATED manifest
    if (meta.flew) {
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const dec = decoded[fkey(f)] || {};
        const upName = dec.extractedSrt ? f.name.replace(/\.(mp4|mov|lrf)$/i, '.srt') : f.name;
        // Apps Script POSTs cap out around 50MB and base64 inflates ×1.37 — a raw file >35MB can
        // never succeed, so fail it fast WITH the reason instead of burning 3 blind retries.
        if (!dec.extractedSrt && f.size > 35 * 1024 * 1024) {
          failed.push(f.name + ' (over the ~35MB upload limit)');
          continue;
        }
        setProgress(`Uploading ${i + 1} / ${files.length} · ${f.name}`);
        try {
          // HARD GUARD: a video without extracted telemetry must NEVER reach the raw-upload path —
          // base64-ing a multi-GB .MP4 kills the tab, and the video must never leave the machine.
          if (/\.(mp4|mov|lrf)$/i.test(f.name) && !dec.extractedSrt) throw new Error('video has no extracted telemetry');
          if (dec.extractedSrt) {
            // M4E video: telemetry was extracted in-browser — upload ONLY that (a few MB).
            // The multi-GB video never leaves this machine.
            const srtBlob = new Blob([dec.extractedSrt], { type: 'application/x-subrip' });
            await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
              name: upName, mimeType: 'application/x-subrip',
              dataB64: btoa(unescape(encodeURIComponent(dec.extractedSrt))) });
            digests.push({ name: upName, sha256: await sha256Hex(srtBlob), bytes: srtBlob.size });
          } else {
            const dataB64 = await fileToB64(f);
            await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
              name: upName, mimeType: f.type || 'application/octet-stream', dataB64 });
            digests.push({ name: upName, sha256: await sha256Hex(f), bytes: f.size });
          }
          attempted.push(upName);
          // Decoded CSV sidecar — its OWN try/catch: the raw flight file above already landed, and
          // the CSV is re-derivable from it at bake time, so a CSV hiccup must not mark the FLIGHT failed.
          const csv = csvFor(f);
          if (csv) {
            try {
              await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
                name: csvName(f.name), mimeType: 'text/csv', dataB64: btoa(unescape(encodeURIComponent(csv))) });
            } catch (e) { /* deliberate: sidecar only — the bake decodes the raw file itself */ }
          }
        } catch (e) {
          failed.push(f.name);                 // record + keep going — do NOT abort the batch
        }
        if (i < files.length - 1) await sleep(250);   // gentle pacing between POSTs (none after the last)
      }
    }
    // Coverage screenshots. iPhone camera-roll images often arrive HEIC with an empty File.type —
    // derive the mime from the stored filename's extension rather than mislabelling a .heic as PNG.
    const coverFailed = [], coverAttempted = [];
    const coverMimeOf = (name, file) => file.type ||
      ({ png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp', heic: 'image/heic', gif: 'image/gif' }[(name.split('.').pop() || '').toLowerCase()] || 'application/octet-stream');
    for (let ci = 0; meta.flew && ci < covers.length; ci++) {
      setProgress(covers.length > 1 ? `Uploading coverage ${ci + 1} / ${covers.length}…` : 'Uploading coverage screenshot…');
      const cname = meta.coverage_images[ci];
      try {
        // Bytes were read + compressed AT ATTACH TIME — never re-read the file handle here (a
        // handle gone stale between attach and submit is exactly what made covers fail while
        // 10MB flight files succeeded). Only a genuine network failure can land in coverFailed now.
        const dataB64 = covers[ci].b64 || (await fileToB64(covers[ci].file));   // legacy fallback only
        await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
          name: cname, mimeType: covers[ci].mime || coverMimeOf(cname, covers[ci].file), dataB64 });
        coverAttempted.push(cname);
      } catch (e) { coverFailed.push(cname + ' (network — check your connection)'); }
      if (ci < covers.length - 1) await sleep(250);   // same gentle pacing as the flight files
    }
    setProgress('Recording submission…');
    // The manifest is NOT "just a summary": on non-flying days it is the ENTIRE submission (no files
    // upload), and on flying days it carries day_type/area/coverage/decoded.
    const manifestName = 'submission-' + meta.ref + '.json';
    let manifestDelivered = true;
    try {
      await postDriveRetry({ action: 'manifest', operator: meta.operator, op_id: meta.op_id,
        date: meta.capture_date, ref: meta.ref,
        meta: { ...meta, failed, coverage_failed: coverFailed.length > 0, digests } });
    } catch (e) { manifestDelivered = false; }

    // File the AUTHENTICATED record of this submission. Deliberately AFTER the uploads: the record
    // states what was actually delivered, so it must not be written before delivery is known.
    // Its failure never fails the submission — the files are already safely in Drive — but it is
    // reported, because an unrecorded submission is a hole in the evidence chain, not a detail.
    const recorded = await relaySubmission(meta, digests, coverAttempted.length, setProgress);
    driveRecorded = recorded;

    // ── CONFIRM RECEIPT — the SOURCE OF TRUTH. Reads what actually landed via verifyDrive()'s JSONP call
    //    (CORS-safe), replacing the old "read the POST's response" check that CORS blocked and mislabeled as
    //    failure. Report ONLY files that genuinely didn't arrive; never cry wolf over an unreadable reply. ──
    setProgress('Confirming receipt…');
    const landed = await verifyDrive(meta.operator, meta.capture_date);
    const problems = [];
    if (landed) {
      // MATCH FILENAMES CASE-INSENSITIVELY (13 Aug 2026). Joe was told 10 of his 27 flight files had
      // not been received. All ten were sitting in Drive, correct and complete. The comparison was an
      // exact Set match, and the two sides disagreed only on the case of the extension:
      //   Drive held  DJI_20260813104443_0001_D.SRT
      //   the form wanted DJI_20260813104443_0001_D.srt
      // The cause is upstream and benign. A drone-written sidecar arrives as .SRT, while an SRT this
      // form EXTRACTS from an MP4 is named with a lowercase .srt (see the upName line above). Drive's
      // own lookup is case-insensitive, so uploading the extracted x.srt finds the existing x.SRT and
      // REPLACES ITS CONTENT, keeping the original uppercase name. The file is right, the bytes are
      // right, only the label differs — and the check called it a loss.
      //
      // That is the worst kind of alarm: it tells a pilot standing in a field to re-send files that
      // already arrived. Getting this wrong twice teaches them to ignore the warning on the day it is
      // finally real, which costs a genuine day of flying. A filesystem-case difference is never a
      // delivery failure, so it must never be reported as one.
      const has = new Set(landed.map((n) => String(n).toLowerCase()));
      const arrived = (n) => has.has(String(n).toLowerCase());
      const missFiles = attempted.filter((n) => !arrived(n)).concat(failed);
      const missCovers = coverAttempted.filter((n) => !arrived(n)).concat(coverFailed);
      const totalFiles = attempted.length + failed.length;
      if (missFiles.length) problems.push(`${totalFiles - missFiles.length}/${totalFiles} flight files confirmed — not received: ${missFiles.join(', ')}.`);
      if (missCovers.length) problems.push(`Coverage screenshot${missCovers.length > 1 ? 's' : ''} not received: ${missCovers.join(', ')}.`);
      if (!arrived(manifestName)) problems.push('The day’s summary wasn’t recorded.');
    } else {
      // verifyDrive() exhausted every retry with no answer. This is NOT proof the files failed — they may
      // well have landed — but it is equally not proof they did, so it must NEVER fall through to a plain
      // "done" screen (that silent gap is exactly how a whole day's submission went missing while the
      // operator saw success, 16 Jul 2026). Surfacing this every time costs an occasional unnecessary
      // resubmit; staying silent costs a real, undetected gap in the compliance record. Resubmitting is
      // always safe (server-side de-dupe by filename), so the safe default is to ask, not assume.
      const allFailed = failed.concat(coverFailed);
      // TELL THEM WHICH FAILURE THIS IS (18 Aug 2026). Damien: "why the hell do we keep getting
      // error messages with this??!! It happens daily." Part of that is that this branch gave the
      // SAME words, ending in "tap Submit again", whether the service was merely slow or was
      // returning 404 to every request because its deployment had been retired. In the second
      // case retrying is futile by definition: the operator taps Submit over and over, watches it
      // fail identically each time, and nothing they can do will ever work. Saying so plainly is
      // both truer and kinder than implying the fix is in their hands.
      if (verifyDrive.lastWhy === 'error') {
        problems.push('The upload service is not responding (it is returning an error, not a result). '
          + 'Your files have NOT been sent, and re-submitting will not help until it is fixed. '
          + 'Send Damien a message, keep the files on your card, and submit again once he says it is back.');
      } else {
        problems.push('Couldn’t confirm this submission was received — it may not have gone through.');
      }
      if (!manifestDelivered) problems.push('The day’s summary couldn’t be sent.');
      if (allFailed.length) problems.push(`Also couldn’t send: ${allFailed.join(', ')}.`);
    }
    // The AUTHENTICATED record is a separate obligation from delivering the files, and it fails
    // separately. Files safely in Drive with no signed record is still a hole in the evidence chain,
    // so it belongs in the same problems list the operator already reads — never a silent pass.
    if (recorded && !recorded.ok) {
      problems.push('Your files were delivered, but the signed submission record could not be filed: '
        + (recorded.error || 'unknown reason') + '. Tell Damien — the files are safe, the record is missing.');
    }
    if (problems.length) {
      // The retry advice is correct for a partial or unconfirmed delivery, and actively wrong when
      // the service itself is down — see the branch above.
      const retryAdvice = verifyDrive.lastWhy === 'error'
        ? ''
        : ' Tap Submit again to re-send — anything already received is replaced, not duplicated.';
      const err = new Error(problems.join(' ') + retryAdvice);
      err.failed = failed;
      err.unconfirmed = !landed;
      throw err;                                 // surfaced on the error screen with the exact missing pieces
    }
  }


  async function submitBundle(meta) {
    setProgress('Packaging your files\u2026');
    const zip = new window.JSZip();
    zip.file('submission.json', JSON.stringify({ ...meta, files: files.map(f => ({ name: f.name, size: f.size })) }, null, 2));
    // Mirror the Drive path: files only on FLYING days (a flew\u2192off switch can leave stale files in
    // state), and for M4E videos bundle the EXTRACTED SRT \u2014 never the multi-GB video (zip generation
    // holds the archive in memory, and the video must never leave the machine).
    const folder = zip.folder('flight-files');
    if (meta.flew) for (const f of files) {
      const dec = decoded[fkey(f)] || {};
      if (dec.extractedSrt) folder.file(f.name.replace(/\.(mp4|mov|lrf)$/i, '.srt'), dec.extractedSrt);
      else if (!/\.(mp4|mov|lrf)$/i.test(f.name)) folder.file(f.name, f);
    }
    // decoded CSVs alongside the raw files
    const csvFolder = zip.folder('decoded-csv');
    if (meta.flew) for (const f of files) { const csv = csvFor(f); if (csv) csvFolder.file(csvName(f.name), csv); }
    // coverage screenshots — attach-time bytes, not the (possibly stale) file handles
    if (meta.flew) covers.forEach((c, ci) => zip.file(meta.coverage_images[ci], c.b64 ? b64ToBlob(c.b64, c.mime) : c.file));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Arealytics_${meta.capture_date}_${meta.op_id}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  const reset = () => {
    setFiles([]); setDecoded({}); setNotes(''); setReason(''); setReasonOther(''); setWorkNote(''); setDayType('flew');
    csvCacheRef.current = {};   // free the memoised multi-MB CSV strings
    clearCovers();
    dateTouchedRef.current = false;
    setSrtSaved('');   // stale "✓ saved" text would hide the save-to-card button on the next day's submission
    setStatus('idle'); setResult(null); setProgress(''); setDate(todayISO());
  };

  // ---- success screen ----
  if (status === 'done' && result) {
    return (
      <Shell>
        <div style={{ textAlign: 'center', padding: '14px 4px', animation: 'ar-pop .35s ease' }}>
          <div style={{ width: 64, height: 64, borderRadius: '50%', background: '#E8F6EE',
            display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px' }}>
            <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#0B8B43"/>
              <path d="M9 16.5 L14 21.5 L23 11" stroke="#fff" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
          <h2 style={{ margin: '0 0 8px', fontSize: 22, color: INK }}>Submission sent</h2>
          <p style={{ margin: '0 auto 4px', color: MUTED, fontSize: 15, maxWidth: 380, lineHeight: 1.5 }}>
            Thanks, {opName.split(' ')[0]}. Your {prettyDate(date)} wrap-up is in.
          </p>
          <div style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 13, color: NAVY,
            background: '#fff', border: `1px solid ${LINE}`, borderRadius: 10, padding: '10px 14px',
            display: 'inline-block', margin: '14px 0 6px' }}>Reference&nbsp; <b>{result.ref}</b></div>
          {result.mode === 'bundle' && (
            <p style={{ margin: '14px auto 0', color: MUTED, fontSize: 13.5, maxWidth: 400, lineHeight: 1.55 }}>
              A file <b>downloaded to your device</b> — send it to your manager (the dashboard imports it).
            </p>
          )}
          {result.mode === 'drive' && (
            <p style={{ margin: '14px auto 0', color: MUTED, fontSize: 13.5, maxWidth: 400, lineHeight: 1.55 }}>
              Saved to your <b>Arealytics Drive folder</b> — it syncs to the dashboard automatically.
            </p>
          )}
          {/* Any operator whose files had telemetry sniffed in-browser (M4E video or Lito .LRF) can
              keep a local SRT copy on the source card. Auto-done if they dropped the folder;
              otherwise one tap to point at the card, or download in the embedded form. */}
          {extractedSrts().length > 0 && (
            <div style={{ marginTop: 16 }}>
              {srtSaved
                ? <p style={{ margin: 0, fontSize: 13.5, color: srtSaved[0] === '✓' ? '#0B8B43' : ORANGE }}>{srtSaved}</p>
                : <button onClick={saveSrtsToCard} style={{ ...btn(NAVY), minWidth: 220 }}>
                    {isEmbedded
                      ? '⬇︎ Download ' + extractedSrts().length + ' SRT' + (extractedSrts().length === 1 ? '' : 's') + ' (.zip)'
                      : '💾 Save ' + extractedSrts().length + ' SRT' + (extractedSrts().length === 1 ? '' : 's') + ' back to my SD card'}
                  </button>}
              {isEmbedded && !srtSaved && (
                <p style={{ margin: '8px auto 0', fontSize: 12, color: MUTED, maxWidth: 380, lineHeight: 1.5 }}>
                  In the embedded form the browser can’t write to your card, so this downloads one .zip (all files, none dropped).
                  To write the SRTs <b>straight onto the card</b>, use <b>Open in browser</b> and drag the whole card folder in.
                </p>
              )}
            </div>
          )}
          <div style={{ marginTop: 26 }}>
            <button onClick={reset} style={{ ...btn(ORANGE), minWidth: 200 }}>Submit another day</button>
          </div>
        </div>
      </Shell>
    );
  }

  return (
    <Shell opFirst={opName ? opName.split(' ')[0] : ''}>
      {/* Single screen — the daily log. (Forms & logs moved to the field app's DOCUMENTS tab, 6 Jul 2026.) */}

      {/* your name */}
      <div style={{ marginBottom: 18 }}>
        <FieldLabel done={nameDone}>Your name</FieldLabel>
        {nameLocked ? (
          // Verified sign-in: name is fixed to the signed-in operator — no dropdown, so no submitting as someone else.
          <div style={{ ...formStyles.field, display: 'flex', alignItems: 'center', gap: 10, background: '#F4F6FB', cursor: 'default' }}>
            <span style={{ display: 'inline-flex', width: 22, height: 22, borderRadius: '50%', background: NAVY,
              color: '#fff', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
              <svg width="13" height="13" viewBox="0 0 16 16"><path d="M4.5 8.3 L7 10.8 L11.6 5.5" stroke="#fff" strokeWidth="1.9" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </span>
            <span style={{ fontSize: 15, fontWeight: 700, color: INK }}>{op ? op.name : ''}</span>
            <span style={{ marginLeft: 'auto', fontSize: 11.5, color: FAINT }}>signed in</span>
          </div>
        ) : (
          <>
            <select className="ar-field" style={formStyles.field} value={opId}
              onChange={(e) => setOpId(e.target.value)}>
              <option value="">Select your name…</option>
              {ROSTER.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
              <option value="other">Other / not listed…</option>
            </select>
            {opId === 'other' && (
              <input className="ar-field" style={{ ...formStyles.field, marginTop: 10 }} placeholder="Type your full name"
                value={otherName} onChange={(e) => setOtherName(e.target.value)} />
            )}
          </>
        )}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 18 }}>
        <div>
          <FieldLabel done={dateDone}>Capture date</FieldLabel>
          <input className="ar-field" style={formStyles.field} type="date" value={date} max={todayISO()}
            onChange={(e) => { setDate(e.target.value); dateTouchedRef.current = true; }} />
          <div style={formStyles.hint}>{prettyDate(date)}</div>
        </div>

        {/* ReOC Daily Risk Assessment — the START-OF-DAY, PRE-FLIGHT record (Dictionary 2.8 / gate 3:
            "no submitted DRA, no flight"). Sits ABOVE the capture flow because it is filled in the
            MORNING before flying; the capture submission below stays the end-of-day touchpoint.
            Same trust pattern as the duty log (own card, own submit, postMessage to the parent's
            Access-verified relay). Never touches the upload flow. */}
        {dutyOn && <DraPanel opId={opId} date={date} />}

        {/* day type — the one required choice each day; maps 1:1 to the reporting categories.
            Splittable into AM/PM since 30 Jul 2026 so a half-lost day reports honestly. */}
        <div>
          <label style={formStyles.label}>
            {splitDay ? 'What kind of day was it? · MORNING' : 'What kind of day was it?'}
          </label>
          <select className="ar-field" style={formStyles.field} value={dayType}
            onChange={(e) => setDayType(e.target.value)}>
            <option value="flew">Flew / captured</option>
            <option value="nofly">Couldn’t fly</option>
            <option value="other">Other work (no flying) — type what it was</option>
            <option value="extract">Image Extraction</option>
            <option value="off">Day off</option>
            <option value="leave">Annual leave / holiday</option>
          </select>

          {(NEEDS_NOTE(dayType) || (splitDay && NEEDS_NOTE(dayTypePm))) && (() => {
            // Which half actually needs the note. Split days can differ, so this picks whichever
            // half is Other/Off/Leave — PM wins if both halves need it, since one shared box can
            // only speak to one reason at a time (the same limit the AM/PM split already lives with).
            const t = (splitDay && NEEDS_NOTE(dayTypePm)) ? dayTypePm : dayType;
            const copy = {
              other: { ph: 'What was the work? e.g. iGuide scanning',
                hint: 'This counts as a work day, not a flying day, so it never counts against your capture target. Just say what you were doing.' },
              off: { ph: 'Why were you off? e.g. sick, rostered day off, personal',
                hint: 'Damien needs this to explain the day to management if asked — just a few words is fine.' },
              leave: { ph: 'What’s the leave for? e.g. annual leave, personal leave',
                hint: 'Damien needs this to explain the day to management if asked — just a few words is fine.' },
            }[t];
            return (
              <div style={{ marginTop: 10, animation: 'ar-pop .25s ease' }}>
                <input className="ar-field" style={formStyles.field}
                  placeholder={copy.ph}
                  value={workNote} onChange={(e) => setWorkNote(e.target.value)} />
                <div style={formStyles.hint}>{copy.hint}</div>
              </div>
            );
          })()}

          {/* One tap. Default OFF, so a normal day is exactly as many taps as before. */}
          <button
            type="button"
            onClick={() => setSplitDay((v) => !v)}
            style={{
              marginTop: 8, background: 'none', border: 'none', padding: 0,
              color: '#0072B2', fontSize: 13, fontWeight: 600, cursor: 'pointer',
              textDecoration: 'underline', textUnderlineOffset: 3,
            }}
          >
            {splitDay ? '− My day was all the same' : '+ My day was split (AM / PM were different)'}
          </button>

          {splitDay && (
            <div style={{ marginTop: 12 }}>
              <label style={formStyles.label}>What kind of day was it? · AFTERNOON</label>
              <select className="ar-field" style={formStyles.field} value={dayTypePm}
                onChange={(e) => setDayTypePm(e.target.value)}>
                <option value="flew">Flew / captured</option>
                <option value="nofly">Couldn’t fly</option>
                <option value="other">Other work (no flying) — type what it was</option>
                <option value="extract">Image Extraction</option>
                <option value="off">Day off</option>
                <option value="leave">Annual leave / holiday</option>
              </select>
              <div style={{ fontSize: 12, color: '#5A6272', marginTop: 8, lineHeight: 1.55 }}>
                Each half counts as half a day, so a morning of flying and a washed-out afternoon
                reports as <b>0.5 flown + 0.5 couldn’t fly</b> — not a whole day of either. Your
                day still totals one day.
              </div>
            </div>
          )}
        </div>

        {/* SPLIT-DAY REASON (30 Jul 2026). When one half flew and the other did not, `didFly` is
            true so the chain below renders the FLYING branch and the "why couldn't you fly?"
            question never appears — yet validation requires a reason, which would strand the
            pilot on a form that cannot be submitted. Render it here as well in exactly that case. */}
        {didFly && anyNoFly && (
          <div style={{ animation: 'ar-pop .25s ease' }}>
            <FieldLabel done={reasonDone}>
              Why couldn’t you fly in the {dayTypePm === 'nofly' ? 'afternoon' : 'morning'}?
            </FieldLabel>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {NO_FLY_REASONS.map(r => (
                <button key={r} onClick={() => setReason(r)}
                  style={{ padding: '9px 14px', borderRadius: 999, fontSize: 13.5, fontWeight: 600,
