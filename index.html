            <div style={{ background: '#FBF3E4', border: '1px solid #E7D3AC', borderRadius: 12, padding: '14px 16px' }}>
              <div style={{ fontWeight: 700, color: '#8A5A0E', fontSize: 14.5, marginBottom: 3 }}>◆ RePL study — {prettyDate(date)}</div>
              <div style={{ fontSize: 13, color: '#7A5A2A', lineHeight: 1.5 }}>Counts as a work day toward your licence — it shows in the team report as RePL progress, not a lost day. Note the module or hours below.</div>
            </div>
          </div>
        ) : (
          <div style={{ animation: 'ar-pop .25s ease' }}>
            <div style={{ background: '#E8F1FA', border: '1px solid #B9D6EE', borderRadius: 12, padding: '14px 16px' }}>
              <div style={{ fontWeight: 700, color: '#0A4C82', fontSize: 14.5, marginBottom: 3 }}>▤ Image Extraction — {prettyDate(date)}</div>
              <div style={{ fontSize: 13, color: '#0A4C82', lineHeight: 1.5 }}>A working day — processing imagery from routes already flown (no new flight). Counts as a full work day in the team report, not a lost/no‑fly day. Note what you worked on below (routes / areas processed).</div>
            </div>
          </div>
        )}

        {/* ReOC Duty & Fatigue — the END-OF-DAY duty close (Dictionary 2.2 binds DUTY to this very
            Daily Field Log submission; duty end + hours are only knowable now). Separate action from
            the flight submission above; entirely independent so it can never interfere with the
            existing, working upload flow. */}
        {dutyOn && (
          <DutyPanel opId={opId} date={date}
            suggestedFlightHours={decSec ? Math.round((decSec / 3600) * 10) / 10 : null} />
        )}

        {/* notes */}
        <div>
          <label style={formStyles.label}>Notes for the day <span style={{ color: FAINT, fontWeight: 500, textTransform: 'none' }}>· optional</span></label>
          <textarea className="ar-field" style={{ ...formStyles.field, minHeight: 96, resize: 'vertical', lineHeight: 1.5 }}
            placeholder="Anything worth mentioning — sites covered, access issues, equipment, handovers…"
            value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>

        {/* submit */}
        {status === 'error' && (
          <div style={{ background: '#FCEBEA', border: '1px solid #E5B4AE', borderRadius: 10, padding: '11px 13px',
            fontSize: 13.5, color: '#9A2B1C', lineHeight: 1.5 }}>{errorMsg}</div>
        )}
        <div>
          <button onClick={submit} disabled={!canSubmit}
            style={{ ...btn(ORANGE), width: '100%', opacity: canSubmit ? 1 : 0.5,
              cursor: canSubmit ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center',
              justifyContent: 'center', gap: 10 }}>
            {status === 'submitting'
              ? <><span style={{ width: 16, height: 16, border: '2px solid rgba(255,255,255,0.4)',
                  borderTopColor: '#fff', borderRadius: '50%', animation: 'ar-spin .7s linear infinite' }} />
                  {progress || 'Sending…'}</>
              : (didFly ? 'Submit today’s capture'
                  : dayType === 'nofly' ? 'Submit no‑fly day'
                  : dayType === 'off' ? 'Submit day off'
                  : dayType === 'repl' ? 'Submit study day'
                  : 'Submit extraction day')}
          </button>
          {status !== 'submitting' && errors.length > 0 && (opId || files.length > 0 || dayType !== 'flew') && (
            <div style={{ marginTop: 10, background: '#FFF6EE', border: '1px solid #FBD8B8', borderRadius: 10, padding: '11px 13px' }}>
              <div style={{ fontSize: 11.5, fontWeight: 800, color: '#B3540A', letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 7 }}>
                {errors.length === 1 ? '1 thing left' : errors.length + ' things left'} before you can submit
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {errors.map((e, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 13, color: MUTED, lineHeight: 1.4 }}>
                    <span style={{ flex: 'none', width: 16, height: 16, marginTop: 1, borderRadius: '50%',
                      border: `1.5px solid ${ORANGE}`, color: ORANGE, fontSize: 11, fontWeight: 800,
                      display: 'grid', placeItems: 'center' }} aria-hidden="true">!</span>
                    <span>{e}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </Shell>
  );
}

// ReOC Duty & Fatigue log — a separate record from the flight-file submission above (its own
// register, its own submit action). Sent via postMessage to the parent field-app page rather than
// straight to the Drive endpoint: the parent holds the real Cloudflare Access session that gives
// this row a CRYPTOGRAPHICALLY VERIFIED created_by (R2) — this iframe never sees or sets identity.
function DutyPanel({ opId, date, suggestedFlightHours }) {
  const [dutyStart, setDutyStart] = useState('');
  const [dutyEnd, setDutyEnd] = useState('');
  const [drivingHours, setDrivingHours] = useState('');
  const [flightHours, setFlightHours] = useState('');
  const [otherHours, setOtherHours] = useState('');
  const [longestBlock, setLongestBlock] = useState('');
  const [fitDeclared, setFitDeclared] = useState(false);
  const [status, setStatus] = useState('idle');   // idle | sending | done | error
  const [msg, setMsg] = useState('');
  const pendingRef = useRef(null);   // { requestId, resolve } — the in-flight request awaiting the parent's reply

  // Dictionary says flight_hours is "pre-filled from parsed telemetry where available, operator
  // confirms rather than types" — seed it once from today's decoded files; the operator can still edit it.
  const seededRef = useRef(false);
  useEffect(() => {
    if (!seededRef.current && suggestedFlightHours != null) {
      seededRef.current = true;
      setFlightHours(String(suggestedFlightHours));
    }
  }, [suggestedFlightHours]);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type !== 'reoc-duty-write-result') return;
      const p = pendingRef.current;
      if (!p || d.requestId !== p.requestId) return;
      pendingRef.current = null;
      p.resolve(d);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Combine the capture DATE with a typed "HH:MM" in the operator's OWN local time, then serialise
  // to a UTC instant — correct regardless of which state's timezone they're actually in (a WA
  // operator's wall-clock 07:30 must not be misread against an eastern-states offset).
  const toISO = (timeStr) => {
    if (!timeStr || !date) return '';
    const [h, m] = timeStr.split(':').map(Number);
    const [y, mo, da] = date.split('-').map(Number);
    const dt = new Date(y, (mo || 1) - 1, da || 1, h || 0, m || 0, 0);
    return isNaN(dt.getTime()) ? '' : dt.toISOString();
  };
  const num = (v) => (v === '' || v == null ? NaN : Number(v));

  const errors = [];
  if (!dutyStart) errors.push('Duty start time');
  if (!dutyEnd) errors.push('Duty end time');
  if (isNaN(num(drivingHours)) || num(drivingHours) < 0 || num(drivingHours) > 12) errors.push('Driving hours (0–12)');
  if (isNaN(num(flightHours)) || num(flightHours) < 0 || num(flightHours) > 8) errors.push('Flight hours (0–8)');
  if (isNaN(num(otherHours)) || num(otherHours) < 0) errors.push('Other work hours');
  if (isNaN(num(longestBlock)) || num(longestBlock) < 0) errors.push('Longest driving block');
  if (!fitDeclared) errors.push('Fit-for-duty declaration');
  const canSend = errors.length === 0 && status !== 'sending';

  const submit = () => {
    if (!canSend) return;
    setStatus('sending'); setMsg('');
    const requestId = 'duty' + Math.random().toString(36).slice(2, 10);
    const payload = {
      operator: opId, duty_date: date,
      duty_start: toISO(dutyStart), duty_end: toISO(dutyEnd),
      driving_hours: num(drivingHours), flight_hours: num(flightHours),
      other_work_hours: num(otherHours), longest_driving_block: num(longestBlock),
      fit_declaration: !!fitDeclared,
    };
    const timeoutId = setTimeout(() => {
      if (pendingRef.current && pendingRef.current.requestId === requestId) {
        pendingRef.current = null;
        setStatus('error'); setMsg('No response from the compliance service — check your connection and try again.');
      }
    }, 15000);
    pendingRef.current = {
      requestId,
      resolve: (d) => {
        clearTimeout(timeoutId);
        if (d.ok) { setStatus('done'); setMsg('Duty record saved' + (d.record_id ? ' · ' + d.record_id : '')); }
        else { setStatus('error'); setMsg(d.error || 'Could not save — try again.'); }
      },
    };
    // The relay on the PARENT page enforces the real trust boundary (it only accepts requests
    // from this exact child origin and only forwards through the Access-verified fetch), so the
    // target origin here just needs to reach whichever page actually framed us.
    let targetOrigin = '*';
    try { if (location.ancestorOrigins && location.ancestorOrigins[0]) targetOrigin = location.ancestorOrigins[0]; } catch (e) {}
    window.parent.postMessage({ type: 'reoc-duty-write', requestId, payload,
      source_form: 'daily-log-duty', device_ts: new Date().toISOString() }, targetOrigin);
  };

  const inp = { ...formStyles.field, padding: '11px 12px', fontSize: 14.5 };
  return (
    <div style={{ animation: 'ar-pop .25s ease' }}>
      <div style={{ background: '#fff', border: `1.5px solid ${LINE}`, borderRadius: 13, padding: '16px 16px 14px' }}>
        <div style={{ fontSize: 11.5, fontWeight: 800, color: NAVY, letterSpacing: '0.05em', textTransform: 'uppercase', marginBottom: 12 }}>
          End of day · Duty &amp; Fatigue log · {prettyDate(date)}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Duty start</label>
            <input className="ar-field" style={inp} type="time" value={dutyStart} onChange={(e) => setDutyStart(e.target.value)} />
          </div>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Duty end</label>
            <input className="ar-field" style={inp} type="time" value={dutyEnd} onChange={(e) => setDutyEnd(e.target.value)} />
          </div>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Driving hours</label>
            <input className="ar-field" style={inp} type="number" min="0" max="12" step="0.1" value={drivingHours}
              onChange={(e) => setDrivingHours(e.target.value)} placeholder="0.0" />
          </div>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Flight hours</label>
            <input className="ar-field" style={inp} type="number" min="0" max="8" step="0.1" value={flightHours}
              onChange={(e) => setFlightHours(e.target.value)} placeholder="0.0" />
            {suggestedFlightHours != null && (
              <div style={{ ...formStyles.hint, marginTop: 4 }}>From today’s flight logs: {suggestedFlightHours}h — adjust if needed.</div>
            )}
          </div>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Other work hours</label>
            <input className="ar-field" style={inp} type="number" min="0" step="0.1" value={otherHours}
              onChange={(e) => setOtherHours(e.target.value)} placeholder="0.0" />
          </div>
          <div>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Longest driving block</label>
            <input className="ar-field" style={inp} type="number" min="0" step="0.1" value={longestBlock}
              onChange={(e) => setLongestBlock(e.target.value)} placeholder="0.0" />
          </div>
        </div>
        <label style={{ display: 'flex', alignItems: 'flex-start', gap: 9, marginTop: 14, fontSize: 13.5, color: INK, cursor: 'pointer' }}>
          <input type="checkbox" checked={fitDeclared} onChange={(e) => setFitDeclared(e.target.checked)}
            style={{ marginTop: 2, width: 16, height: 16, flexShrink: 0 }} />
          <span>I declare I was fit and rested throughout today’s duty (per this morning’s risk assessment).</span>
        </label>
        {status === 'error' && (
          <div style={{ marginTop: 10, background: '#FCEBEA', border: '1px solid #E5B4AE', borderRadius: 9,
            padding: '9px 12px', fontSize: 13, color: '#9A2B1C' }}>{msg}</div>
        )}
        {status === 'done' ? (
          <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 8, fontSize: 13.5, color: '#0B8B43', fontWeight: 600 }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#0B8B43"/><path d="M4.5 8.3 L7 10.8 L11.6 5.5" stroke="#fff" strokeWidth="1.7" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            {msg}
          </div>
        ) : (
          <button onClick={submit} disabled={!canSend}
            style={{ marginTop: 12, background: NAVY, color: '#fff', fontWeight: 700, fontSize: 14,
              padding: '11px 18px', borderRadius: 10, opacity: canSend ? 1 : 0.5, cursor: canSend ? 'pointer' : 'not-allowed' }}>
            {status === 'sending' ? 'Saving…' : 'Submit duty log'}
          </button>
        )}
        {status !== 'sending' && status !== 'done' && errors.length > 0 && (dutyStart || dutyEnd || drivingHours || flightHours || fitDeclared) && (
          <div style={{ marginTop: 8, fontSize: 12, color: FAINT }}>{errors.length} thing{errors.length > 1 ? 's' : ''} left: {errors.join(', ')}.</div>
        )}
      </div>
    </div>
  );
}

// ReOC Daily Risk Assessment (DRA) — the START-OF-DAY, PRE-FLIGHT record, one per operator per
// deployment day. Full DRA-01 v1.1 checklist (4 airspace + 5 weather + 7 site hazards with controls
// + 6 fitness/equipment + risk decision with mitigations) — the register row is only worth anything
// if it's filed BEFORE flying (every row is server-timestamped; CASA can compare against telemetry).
// Same trust pattern as the duty log: this iframe never sees identity or the gateway; it posts the
// payload to the parent field-app page, which holds the real Cloudflare Access session and relays it.
// Server computes dra_id / fit_for_duty / any_site_hazard / needs_crp_ack.
//
// Column packing (register has ONE column per section): a section sends `true` only when every one
// of its items is Yes; otherwise a compact "NO: <items>" string, so the register stays readable and
// nothing is averaged away. Hazards marked present pack as "hazard: control | …" into site_hazards
// (mitigations appended there too — DRA-01 s5 has mitigations but the register has no column for
// them yet; flagged to the CRP as a dictionary amendment candidate).
// NOTE: no area pre-fill here on purpose. This card is filled in the MORNING, before flying, so the
// coverage screenshots that could name a suburb don't exist yet — the operator types the area they
// PLAN to deploy to. (An earlier version seeded from those screenshots; after the day-split that seed
// could never fire, so it's gone rather than left as dead, misleading code.)
function DraPanel({ opId, date }) {
  const AIRSPACE = [
    ['a1', 'Airspace checked via OpenSky / aalti.co / DJI Fly Safe', 'airspace not checked'],
    ['a2', 'No controlled airspace conflicts at planned altitude', 'controlled airspace conflict'],
    ['a3', 'No active TFRs or NOTAMs for the area and time window', 'active TFR/NOTAM'],
    ['a4', 'No restricted areas (aerodrome proximity, emergency ops)', 'restricted area'],
  ];
  const WEATHER = [
    ['w1', 'BOM forecast checked for the deployment zone', 'forecast not checked'],
    ['w2', 'Wind below 25 km/h sustained, gusts below 35 km/h', 'wind above limits'],
    ['w3', 'No rain, fog, or reduced visibility forecast', 'rain/fog/visibility'],
    ['w4', 'No BOM heat health alert active', 'heat health alert'],
    ['w5', 'Temperature within 0–40°C range', 'temperature out of range'],
  ];
  const HAZARDS = [
    ['h1', 'Overhead power lines in operating area'],
    ['h2', 'Construction or heavy machinery activity'],
    ['h3', 'High foot traffic or gatherings of people'],
    ['h4', 'Aggressive animals observed'],
    ['h5', 'Uneven terrain or trip hazards at launch sites'],
    ['h6', 'Limited mobile reception in area'],
    ['h7', 'Other hazard'],
  ];
  const FITNESS = [
    ['f1', 'Operator fit for duty (no impairment, adequate rest)', 'not fit for duty'],
    ['f2', 'All batteries at 100%', 'batteries not full'],
    ['f3', 'Aircraft inspected, no visible damage', 'aircraft not inspected/damaged'],
    ['f4', 'SD card inserted, formatted, labelled', 'SD card not ready'],
    ['f5', 'Water (min 1.5L), sunscreen, PPE carried', 'PPE/water not carried'],
    ['f6', 'Hi-vis vest accessible if required', 'hi-vis not accessible'],
  ];
  const RISKS = [
    { v: 'low', label: 'Low — proceed as planned' },
    { v: 'medium', label: 'Medium — proceed with mitigations in place' },
    { v: 'high', label: 'High — mitigations required, CRP must acknowledge before first flight' },
    { v: 'do_not_proceed', label: 'Do not proceed — unsafe to fly' },
  ];

  const [area, setArea] = useState('');
  const [ans, setAns] = useState({});           // itemId -> true | false
  const [controls, setControls] = useState({}); // hazardId -> control measure text
  const [risk, setRisk] = useState('');
  const [mitigations, setMitigations] = useState('');
  const [status, setStatus] = useState('idle'); // idle | sending | done | error
  const [msg, setMsg] = useState('');
  const pendingRef = useRef(null);

  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type !== 'reoc-dra-write-result') return;
      const p = pendingRef.current;
      if (!p || d.requestId !== p.requestId) return;
      pendingRef.current = null;
      p.resolve(d);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setAnswer = (id, v) => setAns((a) => ({ ...a, [id]: v }));
  const unfit = ans.f1 === false; // DRA-01 s4 / Dictionary: fit_for_duty false blocks submission
  const noAirWx = AIRSPACE.concat(WEATHER).filter((it) => ans[it[0]] === false);
  const hazardsPresent = HAZARDS.filter((it) => ans[it[0]] === true);

  const errors = [];
  if (!area.trim()) errors.push('Planned deployment area / suburb');
  const unanswered = AIRSPACE.concat(WEATHER, FITNESS).filter((it) => ans[it[0]] === undefined).length +
    HAZARDS.filter((it) => ans[it[0]] === undefined).length;
  if (unanswered > 0) errors.push(unanswered + ' checklist item' + (unanswered > 1 ? 's' : '') + ' unanswered');
  hazardsPresent.forEach((it) => {
    if (!(controls[it[0]] || '').trim()) errors.push('Control measure for “' + it[1] + '”');
  });
  if (!RISKS.some((r) => r.v === risk)) errors.push('Risk decision');
  if ((risk === 'medium' || risk === 'high') && !mitigations.trim()) errors.push('Mitigations applied (required for medium/high)');
  if (noAirWx.length && risk === 'low')
    errors.push('A “No” on an airspace or weather check can’t be an overall Low — pick medium/high with mitigations, or do not proceed');
  const canSend = errors.length === 0 && !unfit && status !== 'sending';
  const flagged = risk === 'high' || risk === 'do_not_proceed' || hazardsPresent.length > 0;

  const packSection = (items) => {
    const nos = items.filter((it) => ans[it[0]] === false);
    return nos.length === 0 ? true : 'NO: ' + nos.map((it) => it[2]).join('; ');
  };

  const submit = () => {
    if (!canSend) return;
    setStatus('sending'); setMsg('');
    const requestId = 'dra' + Math.random().toString(36).slice(2, 10);
    let hazStr = hazardsPresent.map((it) => it[1] + ': ' + (controls[it[0]] || '').trim()).join(' | ');
    if (mitigations.trim()) hazStr = (hazStr ? hazStr + ' | ' : '') + 'mitigations: ' + mitigations.trim();
    const payload = {
      operator: opId, dra_date: date, area: area.trim(),
      airspace_checks: packSection(AIRSPACE),
      weather_checks: packSection(WEATHER),
      site_hazards: hazStr,
      fitness_equipment: packSection(FITNESS),
      risk_decision: risk,
    };
    const timeoutId = setTimeout(() => {
      if (pendingRef.current && pendingRef.current.requestId === requestId) {
        pendingRef.current = null;
        setStatus('error'); setMsg('No response from the compliance service — check your connection and try again.');
      }
    }, 15000);
    pendingRef.current = {
      requestId,
      resolve: (d) => {
        clearTimeout(timeoutId);
        if (d.ok) { setStatus('done'); setMsg('Risk assessment saved' + (d.record_id ? ' · ' + d.record_id : '')); }
        else { setStatus('error'); setMsg(d.error || 'Could not save — try again.'); }
      },
    };
    let targetOrigin = '*';
    try { if (location.ancestorOrigins && location.ancestorOrigins[0]) targetOrigin = location.ancestorOrigins[0]; } catch (e) {}
    window.parent.postMessage({ type: 'reoc-dra-write', requestId, payload,
      source_form: 'daily-log-dra', device_ts: new Date().toISOString() }, targetOrigin);
  };

  const inp = { ...formStyles.field, padding: '11px 12px', fontSize: 14.5 };
  // Yes/No toggle — selection carries a glyph + label, never colour alone (colour-blind safe).
  const yn = (id) => (
    <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
      {[true, false].map((v) => {
        const on = ans[id] === v;
        return (
          <button key={String(v)} onClick={() => setAnswer(id, v)} type="button"
            style={{ padding: '5px 11px', borderRadius: 8, fontSize: 12, fontWeight: 800,
              border: '1.5px solid ' + (on ? (v ? NAVY : '#B3540A') : '#C7CCD9'),
              background: on ? (v ? NAVY : '#FFF6EE') : '#fff',
              color: on ? (v ? '#fff' : '#B3540A') : '#8A93A6' }}>
            {v ? '✓ YES' : '– NO'}
          </button>
        );
      })}
    </div>
  );
  const item = (it, extra) => (
    <div key={it[0]} style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
      <span style={{ fontSize: 13.5, color: INK, lineHeight: 1.45, paddingTop: 3 }}>{it[1]}</span>
      {yn(it[0])}
      {extra || null}
    </div>
  );
  const section = (title, children) => (
    <div style={{ marginTop: 16 }}>
      <div style={{ fontSize: 11, fontWeight: 800, color: '#5A6270', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 9 }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>{children}</div>
    </div>
  );

  return (
    <div style={{ animation: 'ar-pop .25s ease' }}>
      <div style={{ background: '#fff', border: `1.5px solid ${NAVY}`, borderRadius: 13, padding: '16px 16px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap', marginBottom: 4 }}>
          <span style={{ fontSize: 11.5, fontWeight: 800, color: NAVY, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
            Start of day · Daily risk assessment
          </span>
          <span style={{ fontSize: 11, color: FAINT }}>{prettyDate(date)}</span>
        </div>
        <div style={{ fontSize: 12.5, color: MUTED, lineHeight: 1.5, marginBottom: 4 }}>
          Fill this <b>before you fly</b> — it’s your pre-flight record (DRA-01). The capture upload below stays an end-of-day job.
        </div>

        <div style={{ marginTop: 12 }}>
          <label style={{ ...formStyles.label, marginBottom: 6 }}>Planned deployment area / suburb</label>
          <input className="ar-field" style={inp} value={area} placeholder="e.g. Yatala QLD"
            onChange={(e) => setArea(e.target.value)} />
        </div>

        {section('1 · Airspace assessment', AIRSPACE.map((it) => item(it)))}
        {section('2 · Weather assessment', WEATHER.map((it) => item(it)))}
        {section('3 · Site hazards — is it present?', HAZARDS.map((it) => (
          <div key={it[0]}>
            {item(it)}
            {ans[it[0]] === true && (
              <input className="ar-field" style={{ ...inp, marginTop: 7 }}
                placeholder={it[0] === 'h7' ? 'Describe the hazard and your control measure' : 'Control measure for this hazard'}
                value={controls[it[0]] || ''}
                onChange={(e) => setControls((c) => ({ ...c, [it[0]]: e.target.value }))} />
            )}
          </div>
        )))}
        {section('4 · Fitness and equipment', FITNESS.map((it) => item(it)))}

        {unfit && (
          <div style={{ marginTop: 12, background: '#FCEBEA', border: '1.5px solid #E5B4AE', borderRadius: 10,
            padding: '11px 13px', fontSize: 13.5, color: '#9A2B1C', lineHeight: 1.5 }}>
            <b>Not fit for duty — do not fly today.</b> This assessment can’t be submitted while unfit.
            Contact the Chief Remote Pilot now so the day is stood down properly.
          </div>
        )}

        <div style={{ marginTop: 16 }}>
          <label style={{ ...formStyles.label, marginBottom: 6 }}>5 · Overall risk decision</label>
          <select className="ar-field" style={{ ...inp, appearance: 'auto' }} value={risk} onChange={(e) => setRisk(e.target.value)}>
            <option value="" disabled>Choose the overall risk…</option>
            {RISKS.map((r) => <option key={r.v} value={r.v}>{r.label}</option>)}
          </select>
        </div>
        {(risk === 'medium' || risk === 'high') && (
          <div style={{ marginTop: 10 }}>
            <label style={{ ...formStyles.label, marginBottom: 6 }}>Mitigations applied</label>
            <textarea className="ar-field" style={{ ...inp, minHeight: 56, resize: 'vertical', lineHeight: 1.5 }}
              placeholder="What you’re doing about the elevated risk…"
              value={mitigations} onChange={(e) => setMitigations(e.target.value)} />
          </div>
        )}
        {flagged && status !== 'done' && !unfit && (
          <div style={{ marginTop: 10, background: '#FBF3E4', border: '1px solid #E7D3AC', borderRadius: 9,
            padding: '9px 12px', fontSize: 13, color: '#8A5A0E' }}>
            ◆ This assessment will be flagged to the Chief Remote Pilot{risk === 'high' ? ' — high risk needs CRP acknowledgement before your first flight' : ''}.
          </div>
        )}
        {status === 'error' && (
          <div style={{ marginTop: 10, background: '#FCEBEA', border: '1px solid #E5B4AE', borderRadius: 9,
            padding: '9px 12px', fontSize: 13, color: '#9A2B1C' }}>{msg}</div>
        )}
        {status === 'done' ? (
          <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 8, fontSize: 13.5, color: '#0B8B43', fontWeight: 600 }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#0B8B43"/><path d="M4.5 8.3 L7 10.8 L11.6 5.5" stroke="#fff" strokeWidth="1.7" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            {msg}
          </div>
        ) : (
          <button onClick={submit} disabled={!canSend}
            style={{ marginTop: 12, background: NAVY, color: '#fff', fontWeight: 700, fontSize: 14,
              padding: '11px 18px', borderRadius: 10, opacity: canSend ? 1 : 0.5, cursor: canSend ? 'pointer' : 'not-allowed' }}>
            {status === 'sending' ? 'Saving…' : 'Submit risk assessment'}
          </button>
        )}
        {status !== 'sending' && status !== 'done' && !unfit && errors.length > 0 && (area || risk || Object.keys(ans).length > 0) && (
          <div style={{ marginTop: 8, fontSize: 12, color: FAINT }}>{errors.length} thing{errors.length > 1 ? 's' : ''} left: {errors.join(', ')}.</div>
        )}
      </div>
    </div>
  );
}
function FieldLabel({ done, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
      <span style={{ ...formStyles.label, marginBottom: 0, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', minWidth: 0 }}>{children}</span>
      {done && (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 700, color: '#0B8B43', textTransform: 'none', letterSpacing: 0 }}>
          <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#0B8B43"/><path d="M4.5 8.3 L7 10.8 L11.6 5.5" stroke="#fff" strokeWidth="1.7" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Verified
        </span>
      )}
    </div>
  );
}


const btn = (bg) => ({ background: bg, color: '#fff', fontWeight: 700, fontSize: 15.5,
  padding: '15px 22px', borderRadius: 12, letterSpacing: '0.01em' });


function Shell({ children, opFirst }) {
  // Time-of-day greeting — operators mostly log in the afternoon/evening, so greet them for when they
  // actually open it. Falls back to the plain title until we know who they are.
  const hr = new Date().getHours();
  const greetWord = hr < 12 ? 'Morning' : hr < 17 ? 'Afternoon' : 'Evening';
  return (
    <div style={{ minHeight: '100vh', padding: '28px 18px 60px' }}>
      <div style={{ maxWidth: 560, margin: '0 auto' }}>
        {/* header */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 22 }}>
          <Logo />
          <span style={{ fontSize: 10.5, fontFamily: '"JetBrains Mono", monospace', letterSpacing: '0.14em',
            color: FAINT }}>FIELD CAPTURE</span>
        </div>

        {/* title band */}
        <div style={{ marginBottom: 20 }}>
          <h1 style={{ margin: '0 0 5px', fontSize: 26, fontWeight: 800, letterSpacing: '-0.01em', color: NAVY }}>
            {opFirst ? `${greetWord}, ${opFirst}` : 'Daily field log'}</h1>
          <p style={{ margin: 0, color: MUTED, fontSize: 15, lineHeight: 1.5 }}>
            Log this <b style={{ color: NAVY }}>every day — whether you flew or not.</b> On flying days, add your .SRT / .TXT files and a marked screenshot of what you covered.</p>
        </div>

        {/* card */}
        <div style={{ background: '#fff', borderRadius: 18, padding: '24px 22px',
          boxShadow: '0 1px 2px rgba(10,31,92,0.05), 0 18px 44px -16px rgba(10,31,92,0.18)' }}>
          {children}
        </div>

        {/* REMOVED 20 Jul 2026 — the "For the manager / admin" setup panel.
            Two reasons, and the first is the serious one.
            1. IT WAS WRONG. It told operators their files went to a Supabase bucket. They do not.
               Submissions POST to the Apps Script uploader and land in Google Drive under
               Flight Logs / Operator Uploads. That second backend was unreachable code and has
               now been removed outright (20 Jul 2026) - Drive already answered the question it
               was answering, and two answers to one question is how the panel came to lie.
            2. It was setup scaffolding from the generic template this form started as — instructions
               for configuring a backend, shown on the tool operators use every day in the field.
            Nothing operational was removed; the panel only described configuration. */}
        <div style={{ textAlign: 'center', marginTop: 18, fontSize: 11.5, color: FAINT }}>
          Arealytics · submissions are private to your team
        </div>
      </div>
    </div>
  );
}

// Mount.
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
