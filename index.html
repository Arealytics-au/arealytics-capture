<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html, body { margin: 0; padding: 0; background: #F4F6FB; color: #0E1320;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  @keyframes ar-spin { to { transform: rotate(360deg); } }
  @keyframes ar-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Zero-setup fallback: bundle the day's files into one downloadable package. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- In-browser DJI decoder: validates & summarises .SRT / .TXT on upload. -->
<script src="flight-decoder.js?v=3"></script>
<!-- AU suburb↔postcode table (offline) — powers the per-area autocomplete/cross-fill on the coverage screenshots. -->
<script src="au-localities.js?b=1"></script>
</head>
<body>
<img src="assets/arealytics-logo-full.png" style="display:none" alt="" id="__logo" />
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#0A1F5C"/>
    <g transform="translate(58,56)" fill="none" stroke="#FF7A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 0 L84 74 L42 56 L0 74 Z"/>
    </g>
    <text x="100" y="168" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="3">AREALYTICS</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useMemo, useEffect } = React;

/* ============================================================================
   ADMIN SETUP — one value. Submissions go straight into Google Drive.

   DRIVE_ENDPOINT is the Apps Script Web app /exec URL (see drive-upload/DEPLOY.md).
   Files land in  Flight Logs / Operator Uploads / <Operator> / <capture date> /
   and the nightly bake reads them from there.

   Leave it blank ONLY to fall back to download-package mode, where the operator
   gets a single .zip to send you and you drop it into the dashboard.
   ============================================================================ */
const CONFIG = {
  // PRIMARY now: files go straight into your Google Drive "Flight Logs" folder,
  // sorted by operator + date, via the Apps Script you deploy (see drive-upload/DEPLOY.md).
  // Paste the Web app /exec URL here to turn it on.
  DRIVE_ENDPOINT: 'https://script.google.com/macros/s/AKfycbwGPAWdqDcadMudMcoqmC7MZQAteHQgM1pRr2U45NxevLBJ1WDt6EeNST6YCLiKxknq/exec',
  DECRYPT_ENDPOINT: '',     // your deployed decrypt-service URL + /decrypt (encrypted .TXT → CSV)
};
window.DECRYPT_ENDPOINT = CONFIG.DECRYPT_ENDPOINT;   // flight-decoder.js reads this

// Roster — operators self-identify. Matches the dashboard roster.
// Each operator carries their HOME STATE — it is authoritative for area attribution (a pilot
// picking a same-named suburb from another state in the autocomplete must never re-state their
// work: "always associate Paul with New South Wales" — Damien, 13 Jul 2026). The autocomplete
// prefers home-state matches and the submission stamps the home state on every tagged area.
const ROSTER = [
  { id: 'op-marc',   name: 'Marc Margot',    state: 'NSW' },
  { id: 'op-paul',   name: 'Paul McConnell', state: 'NSW' },
  { id: 'op-lucas',  name: 'Lucas Moy',      state: 'VIC' },
  { id: 'op-jakob',  name: 'Jakob Kelly',    state: 'VIC' },
  { id: 'op-damien', name: 'Damien Poole',   state: 'QLD' },
  { id: 'op-alex',   name: 'Alex Ballard',   state: 'NSW' },
  { id: 'op-joe',    name: 'Joe Arthey',     state: 'WA' },
  { id: 'op-rob',    name: 'Rob O’Brien', state: 'QLD' },
  { id: 'op-sam',    name: 'Sam',            state: 'SA' },
  { id: 'op-justin', name: 'Justin',         state: 'SA' },
];

// Why a NON-FLYING, NON-STUDY, NON-OFF day happened. RePL study + Day off are now their own
// day-types (first-class buttons), so they're intentionally not in this weather/blocker list.
const NO_FLY_REASONS = [
  'Rain', 'Storms', 'High wind', 'Low cloud / poor light', 'Fog',
  'Equipment fault', 'CASA / permit hold', 'Site access', 'Other',
];

// palette
const NAVY = '#0A1F5C', ORANGE = '#FF7A1A', INK = '#0E1320',
      MUTED = '#5A6270', FAINT = '#8A92A6', LINE = '#E2E6F0', BG = '#F4F6FB';

const fmtBytes = (n) => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
  : (n / 1048576).toFixed(1) + ' MB';

// SRT & TXT logs only for the crew — MP4/video goes through the VST tool. EXCEPTION: Damien's Matrice 4E
// embeds telemetry in the MP4, so HIS uploads also accept video (allowVideo) — the SRT is extracted
// in-browser, only that text uploads (never the video), and it's written back to the folder it came from.
const okFile = (name, allowVideo) => allowVideo ? /\.(srt|txt|mp4|mov)$/i.test(name) : /\.(srt|txt)$/i.test(name);
const fkey = (f) => f.name + '|' + f.size;
const todayISO = () => { const d = new Date(); const z = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const prettyDate = (iso) => { try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-AU',
  { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; } };

const formStyles = {
  field: { width: '100%', padding: '13px 14px', fontSize: 15, color: INK, background: '#fff',
    border: `1.5px solid ${LINE}`, borderRadius: 11, transition: 'border-color .15s, box-shadow .15s' },
  label: { display: 'block', fontSize: 12.5, fontWeight: 700, color: NAVY, letterSpacing: '0.02em',
    marginBottom: 8, textTransform: 'uppercase' },
  hint: { fontSize: 12.5, color: FAINT, marginTop: 6, lineHeight: 1.45 },
};

function Logo() {
  const el = document.getElementById('__logo');
  const src = el && el.src ? el.src : 'assets/arealytics-logo-full.png';
  return <img src={src} alt="Arealytics" style={{ height: 30, display: 'block' }}
    onError={(e) => { e.target.style.display = 'none'; }} />;
}

// ---- AU suburb ↔ postcode lookup (from au-localities.js, parsed once) ----
// Powers the coverage-screenshot cross-fill: type a suburb → postcode appears (and vice-versa).
const AU_LOCS = (() => {
  const raw = (typeof window !== 'undefined' && window.AU_LOCALITIES) || '';
  const rows = [], byPost = new Map();
  for (const line of raw.split('\n')) {
    if (!line) continue;
    const parts = line.split('|'); const s = parts[0], p = parts[1], t = parts[2] || '';
    if (!s || !p) continue;
    const rec = { s, p, t };
    rows.push(rec);
    if (!byPost.has(p)) byPost.set(p, []);
    byPost.get(p).push(rec);
  }
  return { rows, byPost };
})();
// Stable-sort matches so the operator's HOME STATE lists first — same-named suburbs exist in
// several states (Guildford NSW/TAS/WA) and pilots kept picking the wrong state's entry.
function homeFirst(rows, home) {
  if (!home) return rows;
  return rows.filter(r => r.t === home).concat(rows.filter(r => r.t !== home));
}
// suburbs matching a typed name (prefix first, then contains), capped, home state first
function suburbMatches(q, limit, home) {
  limit = limit || 8; q = (q || '').trim().toLowerCase();
  if (q.length < 2) return [];
  const starts = [], contains = [];
  for (const r of AU_LOCS.rows) {
    const sl = r.s.toLowerCase();
    if (sl.startsWith(q)) starts.push(r);
    else if (contains.length < 30 && sl.indexOf(q) > 0) contains.push(r);
  }
  const out = homeFirst(starts, home).slice(0, limit);
  if (out.length < limit) out.push(...homeFirst(contains, home).slice(0, limit - out.length));
  return out;
}
// suburbs whose postcode STARTS WITH the typed digits (so 42 → 4207/4209/…), home state first
function postcodeMatches(p, limit, home) {
  limit = limit || 8; p = (p || '').replace(/[^0-9]/g, '');
  if (p.length < 2) return [];
  const seen = new Set(), out = [];
  for (const r of AU_LOCS.rows) {
    if (r.p.indexOf(p) === 0) { const k = r.p + '|' + r.s; if (!seen.has(k)) { seen.add(k); out.push(r); } }
    if (out.length >= 40) break;
  }
  return homeFirst(out, home).slice(0, limit);
}
const suburbsAtPostcode = (p) => AU_LOCS.byPost.get((p || '').trim()) || [];

// One coverage screenshot's tied location: Suburb + Postcode, each with autocomplete + cross-fill.
function AreaAutocomplete({ cover, onChange, index, home }) {
  const [openField, setOpenField] = useState(null);   // 'suburb' | 'postcode' | null
  const sug = openField === 'suburb' ? suburbMatches(cover.suburb, 8, home)
    : openField === 'postcode' ? postcodeMatches(cover.postcode, 8, home) : [];
  const pick = (r) => { onChange({ suburb: r.s, postcode: r.p, state: r.t }); setOpenField(null); };
  const onSuburb = (v) => {
    const patch = { suburb: v };
    // Unique-match auto-fill prefers the operator's HOME STATE: "Guildford" is NSW+TAS+WA, and
    // Paul (NSW) must land on 2161 — never Tasmania's 7321 (13 Jul 2026).
    const exact = AU_LOCS.rows.filter(r => r.s.toLowerCase() === v.trim().toLowerCase());
    const inHome = home ? exact.filter(r => r.t === home) : [];
    const use = inHome.length === 1 ? inHome[0] : (exact.length === 1 ? exact[0] : null);
    if (use) { patch.postcode = use.p; patch.state = use.t; }
    onChange(patch);
  };
  const onPostcode = (v) => {
    v = v.replace(/[^0-9]/g, '').slice(0, 4);
    const patch = { postcode: v };
    if (v.length === 4) { const at = suburbsAtPostcode(v); if (at.length === 1) { patch.suburb = at[0].s; patch.state = at[0].t; } }
    onChange(patch);
  };
  const tied = cover.suburb && cover.suburb.trim() && /^\d{4}$/.test((cover.postcode || '').trim());
  const wrap = { position: 'relative', flex: 1, minWidth: 0 };
  const menu = { position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, zIndex: 30, background: '#fff',
    border: `1px solid ${LINE}`, borderRadius: 10, boxShadow: '0 12px 30px rgba(14,19,32,0.16)', overflow: 'hidden', maxHeight: 224, overflowY: 'auto' };
  // The postcode field is narrow (116px), so its dropdown must break out wider — anchored to its RIGHT
  // edge and grown leftward — or the suburb names truncate to "Bal…". Capped so it never leaves the card.
  const menuWide = { ...menu, left: 'auto', right: 0, width: 'min(280px, 78vw)' };
  const item = { padding: '9px 12px', fontSize: 14, color: INK, cursor: 'pointer', display: 'flex', justifyContent: 'space-between', gap: 10 };
  const inp = { ...formStyles.field, padding: '10px 12px', fontSize: 14.5 };
  return (
    <div style={{ display: 'flex', gap: 8, marginTop: 9 }}>
      <div style={wrap}>
        <input className="ar-field" style={inp} placeholder={`Suburb / area — screenshot ${index + 1}`}
          value={cover.suburb || ''} autoComplete="off"
          onChange={(e) => onSuburb(e.target.value)}
          onFocus={() => setOpenField('suburb')}
          onBlur={() => setTimeout(() => setOpenField(f => f === 'suburb' ? null : f), 120)} />
        {openField === 'suburb' && sug.length > 0 && (
          <div style={menu}>
            {sug.map((r, k) => (
              <div key={k} style={item} onMouseDown={(e) => e.preventDefault()} onClick={() => pick(r)}
                onMouseEnter={(e) => e.currentTarget.style.background = '#F4F6FB'}
                onMouseLeave={(e) => e.currentTarget.style.background = '#fff'}>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.s}</span>
                <span style={{ color: MUTED, fontFamily: '"JetBrains Mono", monospace', flexShrink: 0 }}>{r.p} {r.t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ ...wrap, flex: '0 0 116px' }}>
        <input className="ar-field" style={inp} placeholder="Postcode" inputMode="numeric"
          value={cover.postcode || ''} autoComplete="off"
          onChange={(e) => onPostcode(e.target.value)}
          onFocus={() => setOpenField('postcode')}
          onBlur={() => setTimeout(() => setOpenField(f => f === 'postcode' ? null : f), 120)} />
        {openField === 'postcode' && sug.length > 0 && (
          <div style={menuWide}>
            {sug.map((r, k) => (
              <div key={k} style={item} onMouseDown={(e) => e.preventDefault()} onClick={() => pick(r)}
                onMouseEnter={(e) => e.currentTarget.style.background = '#F4F6FB'}
                onMouseLeave={(e) => e.currentTarget.style.background = '#fff'}>
                <span style={{ fontFamily: '"JetBrains Mono", monospace', flexShrink: 0 }}>{r.p}</span>
                <span style={{ color: MUTED, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.s} {r.t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [opId, setOpId] = useState(() => {
    // When embedded in the field app the operator is already signed in, so it passes ?op=op-<id>.
    // Preselect their name instead of making them pick it again — one less daily step.
    try { const p = new URLSearchParams(location.search).get('op');
      return (p && ROSTER.some(o => o.id === p)) ? p : ''; } catch (e) { return ''; }
  });
  const [otherName, setOtherName] = useState('');
  const [date, setDate] = useState(todayISO());
  // The day-type is the ONE required choice each day — it maps 1:1 to the reporting categories
  // (flew / weather-or-blocked / day off / RePL study). Replaces the old flew yes/no.
  const [dayType, setDayType] = useState('flew'); // 'flew' | 'nofly' | 'off' | 'repl' | 'extract'
  const [reason, setReason] = useState('');       // weather / blocker reason (when nofly)
  const [reasonOther, setReasonOther] = useState('');
  const [covers, setCovers] = useState([]);       // [{ file, url, suburb, postcode, state }] — each marked screenshot carries its OWN tied location (pilots fly MULTIPLE areas)
  const [files, setFiles] = useState([]);        // File[]
  const [decoded, setDecoded] = useState({});    // fkey -> { status, ...summary }
  // Ref, NOT state: it's read inside async decode callbacks (M4E extraction can run for minutes),
  // and a state value there is a stale closure — the pilot's manually-set date got clobbered.
  const dateTouchedRef = useRef(false);
  const [notes, setNotes] = useState('');
  const [drag, setDrag] = useState(false);
  const [coverDrag, setCoverDrag] = useState(false);   // drag state for the coverage-image dropzone
  const [coverErr, setCoverErr] = useState('');         // LOUD attach-time read failure (never wait for submit)
  const [status, setStatus] = useState('idle');  // idle | submitting | done | error
  const [progress, setProgress] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const [result, setResult] = useState(null);    // { ref, mode }
  const fileRef = useRef(null);
  const coverRef = useRef(null);   // hidden <input type=file> for the coverage screenshot
  // Damien only: a writable handle to the folder his M4E videos were dragged from (his SD card),
  // so the in-browser-extracted SRTs can be written straight back next to the source videos.
  const srtDirRef = useRef(null);
  const submittingRef = useRef(false);   // imperative double-submit lock (state alone races on slow phones)
  const [srtSaved, setSrtSaved] = useState('');   // status line for the write-back

  const driveOn = !!CONFIG.DRIVE_ENDPOINT;
  // The field app appends &lock=1 for a VERIFIED operator (from the Cloudflare sign-in) — lock the name to
  // them so nobody can submit as another operator. Only applies with a valid ?op; standalone use stays editable.
  const nameLocked = (() => {
    try { return new URLSearchParams(location.search).get('lock') === '1' && !!opId && ROSTER.some(o => o.id === opId); }
    catch (e) { return false; }
  })();
  const op = ROSTER.find(o => o.id === opId);
  const opName = opId === 'other' ? otherName.trim() : (op ? op.name : '');

  // ReOC compliance cards (duty log + daily risk assessment) — the field app appends &reoc=1
  // (mirroring its own window.REOC_ENABLED preview flag) only when Damien has switched ReOC preview
  // on. Gated on THREE things: embedded (so the public standalone form is untouched), a KNOWN
  // roster operator (R2 — never a self-declared free-text name in a compliance register), and the
  // flag — never shown by accident, never shown to anyone outside the signed-in field app.
  //
  // Deliberately keyed on `opOnRoster`, NOT on nameLocked. The field app omits &lock=1 for the
  // OWNER (so Damien can act as any operator), which meant the compliance cards silently vanished
  // for the one person who needs them most — the CRP filing his own duty and risk records. `lock`
  // is a UI affordance for the name field; it is not the identity boundary. The real identity check
  // is the gateway's Cloudflare Access JWT, which stamps created_by server-side and cannot be
  // forged from here, and the operator id must still resolve against the roster.
  const isEmbeddedFrame = window.self !== window.top;
  const opOnRoster = !!opId && ROSTER.some((o) => o.id === opId);
  const reocOn = (() => {
    try { return new URLSearchParams(location.search).get('reoc') === '1'; }
    catch (e) { return false; }
  })();
  const dutyOn = isEmbeddedFrame && opOnRoster && reocOn;

  const totalBytes = useMemo(() => files.reduce((a, f) => a + f.size, 0), [files]);

  // Aggregate decode readout for the file list.
  const decList = files.map(f => decoded[fkey(f)]).filter(Boolean);
  const decOk = decList.filter(d => d.status === 'ok').length;
  const decEnc = decList.filter(d => d.status === 'encrypted').length;
  const decErr = decList.filter(d => d.status === 'error').length;
  const decSec = decList.reduce((a, d) => a + (d.durationSec || 0), 0);
  const decodedNote = decList.length
    ? `  ·  ${decOk + decEnc} flight ${(decOk + decEnc) === 1 ? 'log' : 'logs'} ready${decErr ? ` · ${decErr} unreadable — remove to submit` : ''}${decSec ? ` · ${Math.round(decSec / 60)} min flown` : ''}`
    : '';

  // ---- per-field completion (drives the ticks + the submit gate) ----
  const decStates = files.map(f => decoded[fkey(f)] || { status: 'decoding' });
  const anyDecoding = decStates.some(d => d.status === 'decoding');
  const anyError = decStates.some(d => d.status === 'error');
  const didFly = dayType === 'flew';
  const nameDone = !!opName;
  const dateDone = !!date;
  const filesDone = didFly && files.length > 0 && !anyDecoding && !anyError
    && decStates.every(d => d.status === 'ok' || d.status === 'encrypted');
  const reasonDone = dayType === 'nofly' && !!reason && (reason !== 'Other' || !!reasonOther.trim());

  const addFiles = (list) => {
    // submitDrive iterates a SNAPSHOT of `files` — anything added mid-upload would show in the list
    // but silently never send. Freeze the list while submitting.
    if (status === 'submitting') return;
    const incoming = Array.from(list || []).filter(f => okFile(f.name, isDamien));
    const seen = new Set(files.map(f => fkey(f)));
    const fresh = incoming.filter(f => !seen.has(fkey(f)));
    if (!fresh.length) return;
    setFiles(prev => [...prev, ...fresh]);
    setDecoded(d => { const n = { ...d }; fresh.forEach(f => { n[fkey(f)] = { status: 'decoding' }; }); return n; });
    // Decode each new file in the browser — validate + summarise (SRT and TXT).
    const decodeOne = (f) => {
      const k = fkey(f);
      // Decoder missing (script failed to load) = FAIL LOUD. Never mark the file "ok": an undecoded
      // .MP4 would fall through to the raw-upload path and try to POST the multi-GB video itself.
      if (!window.FlightDecoder) { setDecoded(d => ({ ...d, [k]: { status: 'error', error: 'decoder failed to load — reload the page and re-add this file' } })); return Promise.resolve(); }
      return window.FlightDecoder.decode(f, (pct) => {
        setDecoded(d => ({ ...d, [k]: { ...(d[k] || {}), status: 'decoding', progress: pct } }));
      }).then(res => {
        setDecoded(d => ({ ...d, [k]: { status: res.ok ? ((res.encrypted && !res.decrypted) ? 'encrypted' : 'ok') : 'error', ...res } }));
        // First valid SRT date auto-fills the capture date (until the operator edits it).
        if (res.ok && res.dateISO && !dateTouchedRef.current) setDate(res.dateISO);
      }).catch(() => {
        setDecoded(d => ({ ...d, [k]: { status: 'error', error: 'could not be read' } }));
      });
    };
    // Text files decode in parallel (cheap), but VIDEOS go one at a time: each M4E extraction holds
    // tens of MB of chunk buffers + regex state — a 10-video drop decoded concurrently is ~500MB of
    // churn and kills the tab on a field phone.
    const isVid = (f) => /\.(mp4|mov)$/i.test(f.name);
    fresh.filter(f => !isVid(f)).forEach(decodeOne);
    (async () => { for (const f of fresh.filter(isVid)) await decodeOne(f); })();
  };
  const removeFile = (i) => {
    if (status === 'submitting') return;   // list is frozen while uploading (see addFiles)
    const f = files[i];
    setFiles(prev => prev.filter((_, j) => j !== i));
    if (f) setDecoded(d => { const n = { ...d }; delete n[fkey(f)]; return n; });
  };

  // Coverage screenshot — the pilot's marked/coloured picture of the area they flew today.
  // Just an image; stored alongside the flight files so management can see WHAT was covered.
  //
  // READ + COMPRESS AT ATTACH TIME. The old code kept only the File HANDLE and read the bytes at
  // submit — a screenshot that went unreadable between attach and submit (iCloud-evicted Desktop
  // file, stale picker handle) made every submit fail the same way with no clue why (13 Jul 2026:
  // covers 2+3 "Couldn't send" across 3 submissions while 10MB SRTs sailed through). Reading HERE
  // means an unreadable image fails LOUDLY the moment it's added, and submit never touches disk.
  // Compressing (≤1800px JPEG) also cuts a 2–3MB phone screenshot to a few hundred KB.
  const readCover = (file) => new Promise((resolve, reject) => {

    img.onload = () => {
      try {
        const scale = Math.min(1, 1800 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);

      // submit never depends on the file handle. Only a failed read rejects.
      const r = new FileReader();
      r.onload = () => {
        const s = String(r.result || '');

        if (ext === 'jpeg') ext = 'jpg';

          outExt: ext });

    if (!imgs.length) return;
    if (coverRef.current) coverRef.current.value = '';   // let the same file be picked again next time
    const bad = [];
    for (const file of imgs) {
      try {
        const got = await readCover(file);

  const coverNameFor = (cover, i) => `coverage-${date}-${i + 1}.${(cover && cover.outExt) || 'jpg'}`;

  const csvCacheRef = useRef({});

    const k = fkey(f);

    const d = decoded[k];
    if (!d || !d.ok || (d.encrypted && !d.decrypted)) return null;
    let v = null;
    try { v = window.FlightDecoder && window.FlightDecoder.toCSV(d, { operator: opName }); }
    catch (e) { v = null; }

  const csvName = (name) => name.replace(/\.(srt|txt|mp4|mov)$/i, '') + '.csv';

  // ---- Damien only: write the extracted M4E SRTs back next to the source videos (his SD card) ----
  const isDamien = opId === 'op-damien';
  // Running inside the dashboard's overlay (cross-origin iframe)? The folder-write API is blocked there,
  // so the card write-back can't work — we download instead, and the UI says so honestly.
  const isEmbedded = window.self !== window.top;
  // Pull a dropped FOLDER's flight files into the form, and remember the folder so the SRTs
  // can be written straight back into it (Chromium File System Access).
  const addFilesFromDir = async (dir) => {
    const out = [];
    try { for await (const e of dir.values()) { if (e.kind === 'file' && okFile(e.name, true)) out.push(await e.getFile()); } }   // folder-drop is Damien-only → videos allowed

  };

  const extractedSrts = () => files.map(f => {
    const d = decoded[fkey(f)] || {};
    return d.extractedSrt ? { name: f.name.replace(/\.(mp4|mov)$/i, '.srt'), text: d.extractedSrt } : null;
  }).filter(Boolean);
  // Download the extracted SRTs — the fallback when the card can't be written directly (embedded frame or

  // of a burst (that's how 16 became 10), so bundle 2+ into ONE .zip — a single download can't be partially
  // lost — and report the REAL count, never the attempted count.
  const downloadSrts = async (srts) => {
    if (!srts.length) return;

      if (srts.length === 1) {
        const s = srts[0];
        const url = URL.createObjectURL(new Blob([s.text], { type: 'application/x-subrip' }));

        a.href = url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove();

      for (const s of srts) zip.file(s.name, s.text);
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
      const zipName = 'Arealytics_' + (date || todayISO()) + '_SRTs.zip';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = zipName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
      setSrtSaved('✓ All ' + srts.length + ' SRTs downloaded as ' + zipName + ' — unzip them into your card folder.');
    } catch (e) {
      setSrtSaved('Could not package the SRTs (' + ((e && e.message) || e) + '). Try “Open in browser”.');
    }
  };
  const saveSrtsToCard = async () => {
    const srts = extractedSrts();
    if (!srts.length) return;
    // A folder/file picker can't open inside an embedded (cross-origin) frame — when the form runs inside the
    // dashboard's "LOG A CAPTURE" overlay, just download the SRTs instead. A standalone tab still writes the
    // files straight back into the folder you pick (the original behaviour).
    if (window.self !== window.top || !window.showDirectoryPicker) { await downloadSrts(srts); return; }
    let dir = srtDirRef.current;
    try {
      if (!dir) {
        dir = await window.showDirectoryPicker({ id: 'arealytics-m4e-srt', mode: 'readwrite' });
        srtDirRef.current = dir;
      }
      if (dir.requestPermission && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') {
        setSrtSaved('Folder write permission was declined.'); return;
      }
      let n = 0;
      for (const s of srts) {
        const fh = await dir.getFileHandle(s.name, { create: true });
        const w = await fh.createWritable(); await w.write(s.text); await w.close(); n++;
      }
      setSrtSaved('✓ ' + n + ' SRT' + (n === 1 ? '' : 's') + ' saved to “' + (dir.name || 'your folder') + '”.');
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // user closed the folder picker — fine
      await downloadSrts(srts);                    // blocked / unsupported → download instead, never lose them
    }
  };

  // validation
  const errors = [];
  if (!nameDone) errors.push('Select your name.');
  if (!dateDone) errors.push('Choose the capture date.');
  if (didFly) {
    if (files.length === 0) errors.push('Upload the day’s .SRT / .TXT flight logs — or pick a non-flying day above.');
    else if (anyDecoding) errors.push('Checking your files… one moment.');
    else if (anyError) errors.push('Remove the file(s) that couldn’t be read, then add the correct ones.');
    // Coverage screenshot is REQUIRED on a flying day — it's the visual record of the area flown.
    if (!covers.length) errors.push('Add at least one coverage screenshot of the area(s) you flew (marked & coloured).');
    // Every screenshot must carry its OWN suburb + postcode — that's the location tied to that photo.
    else if (covers.some(c => !(c.suburb && c.suburb.trim()) || !/^\d{4}$/.test((c.postcode || '').trim())))
      errors.push('Add the suburb and postcode next to each coverage screenshot.');
  }
  if (dayType === 'nofly' && !reason) errors.push('Pick why you couldn\u2019t fly.');
  if (dayType === 'nofly' && reason === 'Other' && !reasonOther.trim()) errors.push('Add a short reason.');
  const reasonFinal = reason === 'Other' ? (reasonOther.trim() || 'Other') : reason;
  const canSubmit = errors.length === 0 && status !== 'submitting';

  const makeRef = () => `AR-${date.replace(/-/g, '')}-${(opId === 'other' ? 'EXT' : (op ? op.id.replace('op-', '').toUpperCase() : 'OP'))}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

  const submit = async () => {
    // Imperative double-tap guard: two taps landing before a React commit both see canSubmit=true
    // (closure), which would mint two refs + two manifests for the same day.
    if (!canSubmit || submittingRef.current) return;
    submittingRef.current = true;
    setStatus('submitting'); setErrorMsg(''); setProgress('');
    const ref = makeRef();
    const meta = {
      ref, operator: opName, op_id: opId,
      capture_date: date,
      // day_type is the reporting-friendly category; `flew` is kept as a derived boolean so the
      // existing dashboard ingest (which reads meta.flew) keeps working unchanged.
      day_type: dayType, flew: didFly,
      reason: dayType === 'nofly' ? reasonFinal : '',
      // Each coverage screenshot carries its OWN tied location. `areas` is the structured record

        postcode: (c.postcode || '').trim(), state: (op && op.state) || c.state || '',
        state_picked: c.state || '' })) : [],

      coverage_image: (didFly && covers.length) ? coverNameFor(covers[0], 0) : '',   // first one, kept for the existing manifest reader

  };

  // ---- Google Drive path (primary) — files land in Flight Logs/Operator Uploads/<name>/<date>/ ----
  function fileToB64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => { const s = String(r.result || ''); resolve(s.slice(s.indexOf(',') + 1)); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  // Rebuild a Blob from the base64 captured at attach time (bundle/hosted paths must not
  // re-read file handles either — same stale-handle trap as the Drive path).
  function b64ToBlob(b64, mime) {
    const bin = atob(b64 || '');
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || 'application/octet-stream' });

  async function postDrive(payload) {

    // though, is served from a DIFFERENT Google domain (script.googleusercontent.com) that sends no CORS
    // header — so the browser refuses to let us READ it, and that read-block was being mis-reported as an
    // upload failure even though the file had already landed (operators saw a red error + re-submitted).
    // So we DELIVER with mode:'no-cors' (the body still reaches doPost; the opaque reply is simply ignored)
    // and confirm for real afterwards via verifyDrive() — a JSONP read that CORS does not block.
    // A genuine network failure (offline / endpoint unreachable) still REJECTS here, so it's caught + retried.
    await fetch(CONFIG.DRIVE_ENDPOINT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
    return { ok: true };   // "delivered", NOT "confirmed" — verifyDrive() is the source of truth
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  // Single JSONP confirmation attempt (CORS-safe: a <script> GET the browser never CORS-checks).
  // The Apps Script's doGet answers ?verify=1&op=&date=&callback= with callback({files:[...]}).
  // Resolves the name array, or null if THIS attempt got no answer in time.
  function verifyDriveOnce(operator, date, timeoutMs) {
    return new Promise((resolve) => {
      const cb = '__arv' + Math.floor(performance.now()) + Math.floor(Math.random() * 1e6);
      let done = false;
      const s = document.createElement('script');
      const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.remove(); };
      const finish = (val) => { if (done) return; done = true; cleanup(); resolve(val); };
      window[cb] = (data) => finish(data && Array.isArray(data.files) ? data.files : null);

    });

  // so this retries before giving up. Only returns null once every attempt has failed to answer —
  // the caller must treat that as UNCONFIRMED, never as silent success. (16 Jul 2026: a single verify
  // miss was being read as "all good" and an operator's entire day's submission landed nowhere while
  // they saw a clean success screen — this replaced that one-shot check.)
  async function verifyDrive(operator, date) {
    const timeouts = [5000, 7000, 12000];
    for (let attempt = 0; attempt < timeouts.length; attempt++) {
      const result = await verifyDriveOnce(operator, date, timeouts[attempt]);
      if (result) return result;
      if (attempt < timeouts.length - 1) await sleep(900);
    }
    return null;
  }
  // Retry one upload a few times with backoff. SAFE to retry: the Apps Script de-dupes by filename
  // (removeExisting), so a re-sent file replaces rather than stacks. Throws only after all tries fail.
  async function postDriveRetry(payload, tries) {
    tries = tries || 3;
    let lastErr;
    for (let attempt = 1; attempt <= tries; attempt++) {
      try { return await postDrive(payload); }
      catch (e) { lastErr = e; if (attempt < tries) await sleep(700 * attempt); }
    }
    throw lastErr;
  }
  // SHA-256 of a file, hex. This is what binds an uploaded file to the AUTHENTICATED manifest:
  // the files themselves upload straight to the Apps Script (unchanged — that path is deliberately
  // resilient, one file at a time with retries, after a hiccup once lost 6 of 10 flights), but the
  // manifest goes through the Access-verified gateway carrying these digests. A file that is later
  // substituted, or one uploaded by someone forging the endpoint, will not match any signed manifest.
  async function sha256Hex(blob) {
    try {
      const buf = await blob.arrayBuffer();
      const d = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      return '';   // never block a submission on hashing — an unhashed file is flagged, not lost
    }
  }

  // AUTHENTICATED SUBMISSION RECORD.
  //
  // The files upload straight to the Apps Script, which authenticates nothing — anyone holding that
  // /exec URL (it ships in a PUBLIC repo) could POST a submission as any operator on any date. So the
  // EVIDENCE of a submission is filed separately, through the Access-verified compliance gateway:
  // the parent field-app page holds the real Cloudflare Access session and relays it, exactly as it
  // already does for the duty log and the daily risk assessment.
  //
  // What that buys, and it is the whole point: the SERVER decides who submitted (created_by comes
  // from the verified Access identity, never from this payload), the record gets a unique id, a
  // timestamp and an append-only audit row, and it carries the SHA-256 of every file delivered. A
  // file substituted afterwards, or a submission forged straight at the uploader, will not match.
  //
  // Standalone (not embedded) there IS no Access session, so this cannot be filed. It fails LOUD
  // rather than pretending: the operator is told the files landed but the record did not.
  function relaySubmission(meta, digests, coverCount) {
    return new Promise((resolve) => {
      if (window.parent === window) {
        resolve({ ok: false, error: 'not signed in — open the daily log from the Arealytics field app so the submission can be recorded' });
        return;
      }
      const requestId = 'subm' + Math.random().toString(36).slice(2, 10);
      const timeoutId = setTimeout(() => {
        window.removeEventListener('message', onReply);
        resolve({ ok: false, error: 'no response from the compliance service' });
      }, 20000);
      function onReply(e) {
        const d = e.data || {};
        if (d.type !== 'capture-submission-write-result' || d.requestId !== requestId) return;
        clearTimeout(timeoutId);
        window.removeEventListener('message', onReply);
        resolve(d.ok ? { ok: true, record_id: d.record_id } : { ok: false, error: d.error || 'rejected' });
      }
      window.addEventListener('message', onReply);
      let targetOrigin = '*';
      try { if (location.ancestorOrigins && location.ancestorOrigins[0]) targetOrigin = location.ancestorOrigins[0]; } catch (e) {}
      window.parent.postMessage({
        type: 'capture-submission-write', requestId,
        source_form: 'daily-field-log', device_ts: new Date().toISOString(),
        payload: {
          operator: meta.op_id, capture_date: meta.capture_date,
          flew: !!meta.flew, reason: meta.reason || '', ref: meta.ref || '',
          file_count: digests.length, coverage_count: coverCount || 0,
          digests: digests,
        },
      }, targetOrigin);
    });
  }

  let driveRecorded = null;   // result of the authenticated submission record, read by the result screen
  async function submitDrive(meta) {
    // RESILIENT upload: each file is uploaded independently with retry, and one file failing NEVER
    // aborts the rest (the old loop threw on the first failure, silently abandoning every file after
    // it — that's how a transient hiccup lost 6 of 10 flights). We collect failures and report exactly
    // which flights didn't make it so the operator can re-send them (re-sends are de-duped server-side).
    const failed = [];       // GENUINE delivery failures (offline/unreachable) + client-side impossibles
    const attempted = [];     // names we DELIVERED — verifyDrive() confirms which of these actually landed
    const digests = [];       // {name, sha256, bytes} per delivered file — carried on the AUTHENTICATED manifest
    if (meta.flew) {
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const dec = decoded[fkey(f)] || {};
        const upName = dec.extractedSrt ? f.name.replace(/\.(mp4|mov)$/i, '.srt') : f.name;
        // Apps Script POSTs cap out around 50MB and base64 inflates ×1.37 — a raw file >35MB can
        // never succeed, so fail it fast WITH the reason instead of burning 3 blind retries.
        if (!dec.extractedSrt && f.size > 35 * 1024 * 1024) {
          failed.push(f.name + ' (over the ~35MB upload limit)');
          continue;
        }
        setProgress(`Uploading ${i + 1} / ${files.length} · ${f.name}`);
        try {
          // HARD GUARD: a video without extracted telemetry must NEVER reach the raw-upload path —
          // base64-ing a multi-GB .MP4 kills the tab, and the video must never leave the machine.
          if (/\.(mp4|mov)$/i.test(f.name) && !dec.extractedSrt) throw new Error('video has no extracted telemetry');
          if (dec.extractedSrt) {
            // M4E video: telemetry was extracted in-browser — upload ONLY that (a few MB).
            // The multi-GB video never leaves this machine.
            const srtBlob = new Blob([dec.extractedSrt], { type: 'application/x-subrip' });
            await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
              name: upName, mimeType: 'application/x-subrip',
              dataB64: btoa(unescape(encodeURIComponent(dec.extractedSrt))) });
            digests.push({ name: upName, sha256: await sha256Hex(srtBlob), bytes: srtBlob.size });
          } else {
            const dataB64 = await fileToB64(f);
            await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
              name: upName, mimeType: f.type || 'application/octet-stream', dataB64 });
            digests.push({ name: upName, sha256: await sha256Hex(f), bytes: f.size });
          }
          attempted.push(upName);
          // Decoded CSV sidecar — its OWN try/catch: the raw flight file above already landed, and
          // the CSV is re-derivable from it at bake time, so a CSV hiccup must not mark the FLIGHT failed.
          const csv = csvFor(f);
          if (csv) {
            try {
              await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
                name: csvName(f.name), mimeType: 'text/csv', dataB64: btoa(unescape(encodeURIComponent(csv))) });
            } catch (e) { /* deliberate: sidecar only — the bake decodes the raw file itself */ }
          }
        } catch (e) {
          failed.push(f.name);                 // record + keep going — do NOT abort the batch
        }
        if (i < files.length - 1) await sleep(250);   // gentle pacing between POSTs (none after the last)
      }
    }
    // Coverage screenshots. iPhone camera-roll images often arrive HEIC with an empty File.type —
    // derive the mime from the stored filename's extension rather than mislabelling a .heic as PNG.
    const coverFailed = [], coverAttempted = [];
    const coverMimeOf = (name, file) => file.type ||
      ({ png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp', heic: 'image/heic', gif: 'image/gif' }[(name.split('.').pop() || '').toLowerCase()] || 'application/octet-stream');
    for (let ci = 0; meta.flew && ci < covers.length; ci++) {
      setProgress(covers.length > 1 ? `Uploading coverage ${ci + 1} / ${covers.length}…` : 'Uploading coverage screenshot…');
      const cname = meta.coverage_images[ci];
      try {
        // Bytes were read + compressed AT ATTACH TIME — never re-read the file handle here (a
        // handle gone stale between attach and submit is exactly what made covers fail while
        // 10MB flight files succeeded). Only a genuine network failure can land in coverFailed now.
        const dataB64 = covers[ci].b64 || (await fileToB64(covers[ci].file));   // legacy fallback only
        await postDriveRetry({ operator: meta.operator, op_id: meta.op_id, date: meta.capture_date,
          name: cname, mimeType: covers[ci].mime || coverMimeOf(cname, covers[ci].file), dataB64 });
        coverAttempted.push(cname);
      } catch (e) { coverFailed.push(cname + ' (network — check your connection)'); }
      if (ci < covers.length - 1) await sleep(250);   // same gentle pacing as the flight files
    }
    setProgress('Recording submission…');
    // The manifest is NOT "just a summary": on non-flying days it is the ENTIRE submission (no files
    // upload), and on flying days it carries day_type/area/coverage/decoded.
    const manifestName = 'submission-' + meta.ref + '.json';
    let manifestDelivered = true;
    try {
      await postDriveRetry({ action: 'manifest', operator: meta.operator, op_id: meta.op_id,
        date: meta.capture_date, ref: meta.ref,
        meta: { ...meta, failed, coverage_failed: coverFailed.length > 0, digests } });
    } catch (e) { manifestDelivered = false; }

    // File the AUTHENTICATED record of this submission. Deliberately AFTER the uploads: the record
    // states what was actually delivered, so it must not be written before delivery is known.
    // Its failure never fails the submission — the files are already safely in Drive — but it is
    // reported, because an unrecorded submission is a hole in the evidence chain, not a detail.
    const recorded = await relaySubmission(meta, digests, coverAttempted.length);
    driveRecorded = recorded;

    // ── CONFIRM RECEIPT — the SOURCE OF TRUTH. Reads what actually landed via verifyDrive()'s JSONP call
    //    (CORS-safe), replacing the old "read the POST's response" check that CORS blocked and mislabeled as
    //    failure. Report ONLY files that genuinely didn't arrive; never cry wolf over an unreadable reply. ──
    setProgress('Confirming receipt…');
    const landed = await verifyDrive(meta.operator, meta.capture_date);
    const problems = [];
    if (landed) {
      const has = new Set(landed);
      const missFiles = attempted.filter(n => !has.has(n)).concat(failed);
      const missCovers = coverAttempted.filter(n => !has.has(n)).concat(coverFailed);
      const totalFiles = attempted.length + failed.length;
      if (missFiles.length) problems.push(`${totalFiles - missFiles.length}/${totalFiles} flight files confirmed — not received: ${missFiles.join(', ')}.`);
      if (missCovers.length) problems.push(`Coverage screenshot${missCovers.length > 1 ? 's' : ''} not received: ${missCovers.join(', ')}.`);
      if (!has.has(manifestName)) problems.push('The day’s summary wasn’t recorded.');
    } else {
      // verifyDrive() exhausted every retry with no answer. This is NOT proof the files failed — they may
      // well have landed — but it is equally not proof they did, so it must NEVER fall through to a plain
      // "done" screen (that silent gap is exactly how a whole day's submission went missing while the
      // operator saw success, 16 Jul 2026). Surfacing this every time costs an occasional unnecessary
      // resubmit; staying silent costs a real, undetected gap in the compliance record. Resubmitting is
      // always safe (server-side de-dupe by filename), so the safe default is to ask, not assume.
      const allFailed = failed.concat(coverFailed);
      problems.push('Couldn’t confirm this submission was received — it may not have gone through.');
      if (!manifestDelivered) problems.push('The day’s summary couldn’t be sent.');
      if (allFailed.length) problems.push(`Also couldn’t send: ${allFailed.join(', ')}.`);
    }
    if (problems.length) {
      const err = new Error(problems.join(' ') + ' Tap Submit again to re-send — anything already received is replaced, not duplicated.');
      err.failed = failed;
      err.unconfirmed = !landed;
      throw err;                                 // surfaced on the error screen with the exact missing pieces
    }
  }


  async function submitBundle(meta) {
    setProgress('Packaging your files\u2026');
    const zip = new window.JSZip();
    zip.file('submission.json', JSON.stringify({ ...meta, files: files.map(f => ({ name: f.name, size: f.size })) }, null, 2));
    // Mirror the Drive path: files only on FLYING days (a flew\u2192off switch can leave stale files in
    // state), and for M4E videos bundle the EXTRACTED SRT \u2014 never the multi-GB video (zip generation
    // holds the archive in memory, and the video must never leave the machine).
    const folder = zip.folder('flight-files');
    if (meta.flew) for (const f of files) {
      const dec = decoded[fkey(f)] || {};
      if (dec.extractedSrt) folder.file(f.name.replace(/\.(mp4|mov)$/i, '.srt'), dec.extractedSrt);
      else if (!/\.(mp4|mov)$/i.test(f.name)) folder.file(f.name, f);
    }
    // decoded CSVs alongside the raw files
    const csvFolder = zip.folder('decoded-csv');
    if (meta.flew) for (const f of files) { const csv = csvFor(f); if (csv) csvFolder.file(csvName(f.name), csv); }
    // coverage screenshots — attach-time bytes, not the (possibly stale) file handles
    if (meta.flew) covers.forEach((c, ci) => zip.file(meta.coverage_images[ci], c.b64 ? b64ToBlob(c.b64, c.mime) : c.file));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Arealytics_${meta.capture_date}_${meta.op_id}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
